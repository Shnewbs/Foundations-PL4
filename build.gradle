buildscript {
    repositories { maven { url='https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.+' }
}
apply plugin:'net.minecraftforge.gradle'
apply plugin:'java'
version='0.2.0-rc.1-dev'
group='net.foundations.pl4'
archivesBaseName='FoundationsPL4-1.12.2'
sourceCompatibility=targetCompatibility='1.8'
sourceSets {
    main { java.srcDirs=['src/legacy/java']; resources.srcDirs=['src/legacy/resources'] }
    restartTest { java.srcDirs=['src/restartTest/java']; compileClasspath+=sourceSets.main.output+sourceSets.main.compileClasspath; runtimeClasspath+=sourceSets.main.output+sourceSets.main.runtimeClasspath }
    migrationTest { java.srcDirs=['src/migrationTest/java']; compileClasspath+=sourceSets.main.output+sourceSets.main.compileClasspath; runtimeClasspath+=sourceSets.main.output+sourceSets.main.runtimeClasspath }
    legacyTest { compileClasspath+=sourceSets.main.output+sourceSets.main.compileClasspath; runtimeClasspath+=sourceSets.main.output+sourceSets.main.runtimeClasspath }
    legacyRules { java.srcDirs=['tools']; java.include 'CoreChecks.java','FluidChecks.java','EnergyChecks.java'; compileClasspath+=sourceSets.main.output; runtimeClasspath+=sourceSets.main.output }
}
minecraft {
    mappings channel:'snapshot',version:'20171003-1.12'
    runs {
        client { workingDirectory project.file('run'); mods { foundations_pl4 { source sourceSets.main } } }
        server {
            workingDirectory project.file(project.hasProperty('legacyScenarios')?'run-legacy':'run')
            args '--nogui'
            mods { foundations_pl4 { source sourceSets.main } }
            if(project.hasProperty('legacyScenarios')) {
                property 'foundations_pl4.legacyScenarios','true'
                mods { foundations_pl4_legacytests { source sourceSets.legacyTest } }
            }
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.8.1'
    compileOnly 'com.google.guava:guava:21.0'
}
tasks.withType(JavaCompile).all { options.encoding='UTF-8' }
processResources {
    inputs.property 'version',project.version
    filesMatching('mcmod.info') { expand 'version':project.version }
    from('src/main/resources') {
        include 'assets/foundations_pl4/textures/block/data_cable.png'
        include 'assets/foundations_pl4/textures/block/model/transfer_node_remove.png'
        include 'assets/foundations_pl4/textures/block/model/transfer_node_add.png'
    }
}
jar { from('LICENSE'); from('LICENSE-SonarCore'); from('NOTICE'); manifest { attributes('Implementation-Version':project.version) }; finalizedBy 'reobfJar' }
// Acceptance runs the reobfuscated runtime and separate fixture JAR on an installed Forge server.
// Development MergeTool APIs must never be copied into the production server classpath.
task legacyTestJar(type:Jar) { dependsOn legacyTestClasses; from sourceSets.legacyTest.output; classifier='native-scenarios' }
reobf { legacyTestJar { classpath=sourceSets.legacyTest.compileClasspath } }
legacyTestJar.finalizedBy reobfLegacyTestJar
task sourcesJar(type:Jar) { from sourceSets.main.allSource; classifier='sources' }
task legacyRules(type:JavaExec) { dependsOn legacyRulesClasses; classpath=sourceSets.legacyRules.runtimeClasspath; main='CoreChecks' }
check.dependsOn legacyRules
build.dependsOn sourcesJar
if(project.hasProperty('legacyScenarios')) tasks.matching { it.name=='runServer' }.all { dependsOn legacyTestClasses }
tasks.withType(AbstractArchiveTask).all { preserveFileTimestamps=false; reproducibleFileOrder=true }

task migrationTestJar(type:Jar) { dependsOn migrationTestClasses; from sourceSets.migrationTest.output; classifier='migration-scenarios' }
reobf { migrationTestJar { classpath=sourceSets.migrationTest.compileClasspath } }
migrationTestJar.finalizedBy reobfMigrationTestJar
build.dependsOn migrationTestJar

task restartTestJar(type:Jar) { dependsOn restartTestClasses; from sourceSets.restartTest.output; classifier='restart-scenarios' }
reobf { restartTestJar { classpath=sourceSets.restartTest.compileClasspath } }
restartTestJar.finalizedBy reobfRestartTestJar
build.dependsOn restartTestJar
