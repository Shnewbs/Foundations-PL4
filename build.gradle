plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '7.0.28'
    id 'net.minecraftforge.renamer' version '1.1.2'
}
version='0.2a-legacy-preview.1'
group='net.foundations.pl4'
base.archivesName='FoundationsPL4-1.6.4'
java { toolchain.languageVersion=JavaLanguageVersion.of(8); withSourcesJar() }
sourceSets {
    main { java.setSrcDirs(['src/legacy/java']); resources.setSrcDirs(['src/legacy/resources']) }
    legacyTest { compileClasspath+=sourceSets.main.output+sourceSets.main.compileClasspath; runtimeClasspath+=sourceSets.main.output+sourceSets.main.runtimeClasspath }
    legacyRules { java.setSrcDirs(['tools']); java.include 'CoreChecks.java'; compileClasspath+=sourceSets.main.output; runtimeClasspath+=sourceSets.main.output }
}
tasks.withType(JavaCompile).configureEach { sourceCompatibility='1.7'; targetCompatibility='1.7'; options.encoding='UTF-8' }
repositories { mavenCentral(); minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven }
minecraft { mappings channel:'snapshot',version:'20130918-1.6.3' }
dependencies { implementation minecraft.dependency('net.minecraftforge:forge:1.6.4-9.11.1.960') }
processResources {
    inputs.property 'version',project.version
    filesMatching('mcmod.info') { expand 'version':project.version }
    from('src/main/resources/assets/foundations_pl4/textures/block') {
        include 'data_cable.png'
        rename 'data_cable.png','legacy_cable.png'
        into 'assets/foundations_pl4/textures/blocks'
    }
    from('src/main/resources/assets/foundations_pl4/textures/block/model') {
        include 'transfer_node_remove.png','transfer_node_add.png'
        rename 'transfer_node_remove.png','legacy_export.png'
        rename 'transfer_node_add.png','legacy_import.png'
        into 'assets/foundations_pl4/textures/blocks'
    }
}
tasks.named('jar',Jar) { from('LICENSE');from('LICENSE-SonarCore');from('NOTICE');manifest { attributes('Implementation-Version':project.version) } }
renamer.mappings.from minecraft.dependency.toSrgFile
def runtimeJar=renamer.classes(tasks.named('jar',Jar)) { map.from minecraft.dependency.toSrgFile;archiveClassifier='srg' }
def fixtures=tasks.register('legacyTestJar',Jar) { dependsOn 'legacyTestClasses';from sourceSets.legacyTest.output;archiveClassifier='native-scenarios' }
def testJar=renamer.classes(fixtures) { map.from minecraft.dependency.toSrgFile;archiveClassifier='native-scenarios-srg' }
tasks.register('legacyRules',JavaExec) { dependsOn 'legacyRulesClasses';classpath=sourceSets.legacyRules.runtimeClasspath;mainClass='CoreChecks';javaLauncher=javaToolchains.launcherFor {languageVersion=JavaLanguageVersion.of(8)} }
tasks.named('check') { dependsOn 'legacyRules' }
tasks.named('build') { dependsOn runtimeJar,testJar }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false;reproducibleFileOrder=true }
