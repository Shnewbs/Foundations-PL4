plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.2a-port.1'
group = 'net.foundations.pl4'
base { archivesName = 'FoundationsPL4-1.15.2' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
sourceSets {
    portTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    portTestImplementation.extendsFrom implementation
    portTestRuntimeOnly.extendsFrom runtimeOnly
}
minecraft {
    mappings channel: 'official', version: '1.15.2'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { foundations_pl4 { source sourceSets.main } }
        }
        client { }
        server {
            args '--nogui'
            if (project.hasProperty('portScenarios')) {
                workingDirectory project.file('run-scenarios')
                property 'foundations_pl4.portScenarioServer','true'
                mods { foundations_pl4_porttests { source sourceSets.portTest } }
            }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.15.2-31.2.62' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xmaxerrs','1000'] }
// Forge recompiles its vanilla dependencies using Java 8. Do not inject --release into that compiler.
['compileJava','compileTestJava','compilePortTestJava'].each { name ->
    tasks.named(name,JavaCompile) { options.release=17 }
}
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
processResources {
    inputs.property 'version',project.version
    filesMatching('META-INF/mods.toml') { expand 'version':project.version }
}
jar {
    from('LICENSE'); from('LICENSE-SonarCore'); from('NOTICE')
    manifest { attributes('Implementation-Version':project.version) }
    finalizedBy 'reobfJar'
}
tasks.register('verifyPortRules',Exec) { commandLine 'python3','tools/run_port_checks.py' }
tasks.named('check') { dependsOn 'verifyPortRules' }
tasks.register('verifyPortJar') {
    dependsOn 'reobfJar'
    doLast {
        def archive=tasks.jar.archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def metadata=zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!metadata.contains('version="'+project.version+'"') || !metadata.contains('versionRange="[1.15.2]"')) throw new GradleException('Incorrect Forge target metadata')
            zip.entries().each { entry ->
                if (entry.name.contains('compat/scenarios/') || entry.name.endsWith('GameTests.class')) throw new GradleException('Test fixture leaked into runtime: '+entry.name)
                if (entry.name.endsWith('.jar')) throw new GradleException('Unexpected bundled mod: '+entry.name)
                if (entry.name.endsWith('.class')) {
                    def content=new String(zip.getInputStream(entry).bytes,java.nio.charset.StandardCharsets.ISO_8859_1)
                    for (invalid in ['sonar/core/','mcmultipart/','net/neoforged/']) if (content.contains(invalid)) throw new GradleException('Foreign-loader dependency in '+entry.name)
                }
            }
        }
        logger.lifecycle('PASS standalone Forge 1.15.2 artifact identity and dependencies')
    }
}
tasks.named('build') { dependsOn 'verifyPortJar' }
if (project.hasProperty('portScenarios')) tasks.matching { it.name == 'runServer' }.configureEach { dependsOn tasks.named('portTestClasses') }

apply from: 'tools/java8/runtime.gradle'
