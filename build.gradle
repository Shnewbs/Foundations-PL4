plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}
version = '0.2b-port.1'
group = 'net.foundations.pl4'
base { archivesName = 'FoundationsPL4-1.20.2' }
java { toolchain.languageVersion = JavaLanguageVersion.of(17); withSourcesJar() }
sourceSets {
    portTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations { portTestImplementation.extendsFrom implementation; portTestRuntimeOnly.extendsFrom runtimeOnly }
minecraft {
    mappings channel: 'official', version: '1.20.2'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { foundations_pl4 { source sourceSets.main } }
        }
        client { }
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'foundations_pl4'
            property 'foundations_pl4.isolatedGameTestConfig', 'true'
            property 'foundations_pl4.portTestServer', 'true'
            mods { foundations_pl4 { source sourceSets.portTest } }
        }
    }
}
repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.2-48.1.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release=17; options.compilerArgs += ['-Xmaxerrs','1000'] }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
processResources {
    inputs.property 'version',project.version
    filesMatching('META-INF/mods.toml') { expand 'version':project.version }
}
processPortTestResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}
jar {
    from('LICENSE'); from('LICENSE-SonarCore'); from('NOTICE')
    exclude '**/*GameTests*.class', '**/PortAssertions*.class', '**/PLPortTestMod*.class'
    manifest { attributes('Implementation-Version':project.version) }
    finalizedBy 'reobfJar'
}
tasks.register('scenarioMetadata') {
    dependsOn 'processResources'
    outputs.dir layout.buildDirectory.dir('scenario-metadata')
    doLast {
        def out=file('build/scenario-metadata/META-INF/mods.toml'); out.parentFile.mkdirs()
        out.text=file('build/resources/main/META-INF/mods.toml').text + '''
[[mods]]
modId="foundations_pl4_porttests"
version="1"
displayName="PL4 isolated Forge48 GameTests (not for production)"
'''
    }
}
tasks.register('scenarioRuntimeJar', Jar) {
    dependsOn 'classes','portTestClasses','scenarioMetadata'
    archiveClassifier='native-scenarios'
    from(sourceSets.main.output) {
        exclude 'META-INF/mods.toml', '**/*GameTests*.class', '**/PortAssertions*.class', '**/PLPortTestMod*.class'
    }
    from(sourceSets.portTest.output) { exclude 'META-INF/mods.toml'; exclude 'pack.mcmeta' }
    from('build/scenario-metadata')
    from('LICENSE'); from('LICENSE-SonarCore'); from('NOTICE')
    manifest { attributes('Implementation-Version':project.version) }
    duplicatesStrategy=DuplicatesStrategy.EXCLUDE
    finalizedBy 'reobfScenarioRuntimeJar'
}
afterEvaluate {
    reobf { scenarioRuntimeJar { classpath=sourceSets.portTest.compileClasspath } }
}
tasks.configureEach {
    if (name == 'runGameTestServer') {
        doFirst { project.ext.nativeGameTestStart = System.currentTimeMillis() }
        doLast {
            def log = file('run/logs/latest.log')
            if (!log.isFile() || log.lastModified() < project.ext.nativeGameTestStart - 1000L ||
                    !log.getText('UTF-8').contains('All 191 required tests passed :)')) {
                throw new GradleException('Forge 1.20.2 native acceptance requires 191/191 GameTests in the current server log')
            }
        }
    }
}
tasks.register('verifyPortRules',Exec) { commandLine 'python3','tools/run_port_checks.py' }
tasks.named('check') { dependsOn 'verifyPortRules' }
tasks.register('verifyPortJar') {
    dependsOn 'reobfJar'
    doLast {
        def archive=tasks.jar.archiveFile.get().asFile
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def metadata=zip.getInputStream(zip.getEntry('META-INF/mods.toml')).getText('UTF-8')
            if (!metadata.contains('version="'+project.version+'"') || !metadata.contains('versionRange="[1.20.2,1.20.3)"')) throw new GradleException('Incorrect Forge target metadata')
            zip.entries().each { entry ->
                if (entry.name.contains('GameTests') || entry.name.contains('PortAssertions') || entry.name.contains('PLPortTestMod')) throw new GradleException('Leaked native test class: '+entry.name)
                if (entry.name.endsWith('.jar')) throw new GradleException('Unexpected bundled mod: '+entry.name)
                if (entry.name.endsWith('.class')) {
                    def content=new String(zip.getInputStream(entry).bytes,java.nio.charset.StandardCharsets.ISO_8859_1)
                    for (invalid in ['sonar/core/','mcmultipart/','net/neoforged/']) if (content.contains(invalid)) throw new GradleException('Foreign-loader dependency in '+entry.name)
                }
            }
        }
        logger.lifecycle('PASS standalone Forge 1.20.2 artifact identity and dependencies')
    }
}
tasks.named('build') { dependsOn 'verifyPortJar' }
tasks.named('build') { dependsOn 'reobfScenarioRuntimeJar' }
