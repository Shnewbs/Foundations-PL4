name: Forge 1.13.2 native port investigation
on:
  push:
    branches: [mc/1.13.2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge1132-port
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Prepare exact native source and save revision
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_1132.py
          python3 tools/backport_1132_mcp_names.py
          git diff --check
          git add src tools/java8 tools/run_port_checks.py build.gradle BUILD_STATUS.json PORT_TARGET.json README.md docs/releases/0.2a-port.1.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Prepare exact 1.13.2 Forge25 native feature source"
            git push origin HEAD:mc/1.13.2
          fi
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
      - name: Compile and verify target sources (no release on failed gate)
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Installed native scenarios (exact Forge25)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native.log
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('verification-logs/port-scenarios.json').read_text())
          assert r['minecraft']=='1.13.2' and r['total']==194 and r['passed']==194 and r['failed']==0,r
          print('PASS 194 native Forge25 scenarios')
          PY
      - name: Preserve exact sources and diagnostics, without publishing unverified binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge1132-native-evidence
          path: |
            verification-logs/
            build/java8/*.json
            build/reports/
            run-java8/port-scenarios.json
            run-java8/crash-reports/
            run-java8/logs/
          retention-days: 14
          if-no-files-found: warn
