name: Forge 1.15.2 full feature port validation
on:
  push:
    branches: [mc/1.15.2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge1152-native-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/mc/1.15.2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Prepare and preserve the exact source target
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_1152.py
          git diff --check
          git add src tools/java8 tools/run_port_checks.py build.gradle BUILD_STATUS.json docs/FIELD_GUIDE.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Target the full feature implementation to exact Minecraft 1.15.2'
            git push origin HEAD:mc/1.15.2
          fi
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
      - name: Native compile, Java 8 conversion and archive verification
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Complete native scenarios on installed Forge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native-run.log
      - name: Publish only a passed exact-target runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET=1.15.2
          test "$(git ls-remote origin refs/heads/mc/$TARGET | cut -f1)" = "$(git rev-parse HEAD)"
          VERSION=$(python3 -c 'import json; print(json.load(open("BUILD_STATUS.json"))["version"])')
          TAG="mc$TARGET-v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            git diff --exit-code "$TAG" HEAD -- src/main build.gradle tools/java8 gradle/ gradle.properties settings.gradle
            gh release view "$TAG"; exit 0
          fi
          NAME="FoundationsPL4-$TARGET-$VERSION"
          mkdir -p release-files
          cp "build/libs/$NAME-java8.jar" "release-files/$NAME.jar"
          cp "build/libs/$NAME-sources.jar" release-files/
          git archive --format=zip --output="release-files/$NAME-source.zip" HEAD
          cp .java8-toolchain/jvmdowngrader-source.zip release-files/JvmDowngrader-2.0.1-source.zip
          cp verification-logs/installed-native.log verification-logs/java8-summary.json verification-logs/port-scenarios.json build/java8/archive-check.json build/java8/toolchain.json release-files/
          git rev-parse HEAD > release-files/SOURCE_COMMIT.txt
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          git tag "$TAG"; git push origin "$TAG"
          gh release create "$TAG" release-files/* --verify-tag --prerelease --title "Foundations PL4 $TARGET $VERSION - Java 8" --notes-file "docs/releases/$VERSION.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge1152-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-files/
            verification-logs/
            build/java8/*.json
            run-java8/port-scenarios.json
            run-java8/crash-reports/
          retention-days: 14
          if-no-files-found: warn
