name: Forge 1.15.2 exact-source native and production validation
on:
  push:
    branches: [mc/1.15.2]
    paths-ignore:
      - '.github/workflows/**'
      - 'tools/test_publisher_policy_1152.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge1152-native-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/mc/1.15.2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact checked-out source without transformations
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > verification-logs/SOURCE_COMMIT.txt
          sha256sum verification-logs/checked-source.zip > verification-logs/SOURCE_ARCHIVE_SHA256SUMS.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Native compile, Java 8 conversion and archive checks
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: All 194 native scenarios on installed Forge 31
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native-run.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('verification-logs/port-scenarios.json').read_text())
          assert report['minecraft']=='1.15.2' and report['total']==194 and report['passed']==194 and report['failed']==0, report
          print('PASS 194 exact Forge31 native scenarios')
          PY
      - name: Stock Forge 31 production-only JAR startup and clean stop
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/production_smoke_1152.py 2>&1 | tee verification-logs/production-smoke-step.log
      - name: Inspect mapped Forge 31 API after a failed native gate
        if: failure()
        shell: bash
        run: python3 tools/inspect_1152_api.py
      - name: Record exact packaged JAR and diagnostic hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          if test -d build/libs; then
            find build/libs -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 -r sha256sum > verification-logs/JAR_SHA256SUMS.txt
          fi
          for file in verification-logs/build.log verification-logs/native-run.log verification-logs/port-scenarios.json verification-logs/production-smoke.log; do
            if test -f "$file"; then sha256sum "$file"; fi
          done > verification-logs/LOG_SHA256SUMS.txt
      - name: Preserve exact 1.15.2 validation evidence (no publishing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge1152-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-logs/
            build/libs/*.jar
            build/java8/*.json
            run-java8/port-scenarios.json
            run-java8/crash-reports/
            run-java8/logs/
          retention-days: 14
          if-no-files-found: warn
