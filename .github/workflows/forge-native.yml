name: Forge 1.13.2 native port investigation
on:
  push:
    branches: [mc/1.13.2]
    paths-ignore:
      - '.github/workflows/**'
      - 'tools/test_publisher_policy_1132.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge1132-port
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact immutable checked-out source (no transforms or pushes)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > verification-logs/SOURCE_COMMIT.txt
          sha256sum verification-logs/checked-source.zip > verification-logs/SOURCE_ARCHIVE_SHA256SUMS.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Compile and verify exact Forge25 source (no release on failure)
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Installed native scenarios (exact Forge25)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native.log
          python3 - <<'PY'
          import json, pathlib
          report=json.loads(pathlib.Path('verification-logs/port-scenarios.json').read_text())
          assert report['minecraft']=='1.13.2' and report['total']==194 and report['passed']==194 and report['failed']==0, report
          print('PASS 194 native Forge25 scenarios')
          PY
      - name: Preserve actual produced JAR and log hashes (even on failure)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          if test -d build/libs; then
            find build/libs -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 -r sha256sum > verification-logs/JAR_SHA256SUMS.txt
          fi
          for log in verification-logs/build.log verification-logs/native.log verification-logs/port-scenarios.json; do
            if test -f "$log"; then sha256sum "$log"; fi
          done > verification-logs/LOG_SHA256SUMS.txt
      - name: Preserve exact sources and diagnostics without publishing unverified binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge1132-native-evidence
          path: |
            verification-logs/
            build/libs/*.jar
            build/java8/*.json
            build/reports/
            run-java8/port-scenarios.json
            run-java8/crash-reports/
            run-java8/logs/
          retention-days: 14
          if-no-files-found: warn
