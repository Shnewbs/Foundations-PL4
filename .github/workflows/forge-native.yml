name: Forge 1.14.4 native port investigation
on:
  push:
    branches: [mc/1.14.4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge1144-port
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Prepare exact sources and preserve revision
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_1144.py
          python3 tools/backport_1144_api.py
          python3 tools/backport_1144_stage2.py
          python3 tools/backport_1144_stage3.py
          git diff --check
          git add src tools/java8 tools/run_port_checks.py build.gradle BUILD_STATUS.json README.md docs/FIELD_GUIDE.md docs/releases/0.2a-port.1.md PORT_TARGET.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Prepare independent Minecraft 1.14.4 Forge 28 source'
            git push origin HEAD:mc/1.14.4
          fi
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
      - name: Compile, validate and reobfuscate exact target
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Run isolated native scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          result=json.loads(Path('verification-logs/port-scenarios.json').read_text())
          assert result['minecraft']=='1.14.4' and result['total']==194 and result['passed']==194 and result['failed']==0,result
          print('PASS 194 isolated target scenarios')
          PY
      - name: Capture mapped Forge 28 API contracts
        if: always()
        shell: bash
        run: python3 tools/inspect_1144_api.py
      - name: Preserve results (no automatic release before parity acceptance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge1144-native-evidence
          path: |
            verification-logs/
            build/java8/*.json
            build/reports/
            run-java8/port-scenarios.json
            run-java8/logs/
            run-java8/crash-reports/
          retention-days: 14
          if-no-files-found: warn
