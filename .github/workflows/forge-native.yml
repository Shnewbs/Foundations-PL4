name: Forge 1.14.4 native port investigation
on:
  push:
    paths-ignore: ['.github/workflows/**']
    branches: [mc/1.14.4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge1144-port
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read publication maturity from exact checked-out source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          """Shared release maturity and explicit RC clearance policy."""
          import re


          def release_type(version):
              text = version.lower()
              if re.search(r"(?:^|[.\-_])(?:dev|snapshot|nightly)(?:[.\-_]|$)", text):
                  raise ValueError("Development snapshots are not qualified releases")
              if re.search(r"beta|(?:^|[.\-_])rc\d*(?:[.\-_]|$)|\db(?:[.\-_]|$)", text):
                  return "beta"
              if re.search(r"alpha|preview|experimental|(?:^|[.\-_])port(?:[.\-_]|$)|\da(?:[.\-_]|$)", text):
                  return "alpha"
              return "release"


          def is_rc(version):
              return bool(re.search(r"(?:^|[.\-_])rc\d*(?:[.\-_]|$)", version, re.I))


          def require_publication(status, minecraft=None, version=None):
              if not isinstance(status, dict):
                  raise ValueError("Missing exact-source build status")
              actual = status.get("version", "")
              if not actual or (version is not None and actual != version):
                  raise ValueError("Build status and release version disagree")
              if minecraft is not None and status.get("minecraft") != minecraft:
                  raise ValueError("Build status and exact Minecraft target disagree")
              maturity = release_type(actual)
              if status.get("release_channel", "").lower() == "development":
                  raise ValueError("Development channel is not publishable")
              if is_rc(actual) and status.get("rc_publication_cleared") is not True:
                  raise ValueError("RC publication has not been explicitly cleared")
              return maturity

          status = json.loads(Path('BUILD_STATUS.json').read_text())
          try:
              require_publication(status)
              allowed = True
          except ValueError as error:
              allowed = False
              print('Publication held:', error)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PL4_ALLOW_PUBLICATION=' + str(allowed).lower() + '\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Archive immutable exact-target source (read-only)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
      - name: Compile, validate and reobfuscate exact target
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Run isolated native scenarios
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          result=json.loads(Path('verification-logs/port-scenarios.json').read_text())
          assert result['minecraft']=='1.14.4' and result['total']==194 and result['passed']==194 and result['failed']==0,result
          print('PASS 194 isolated target scenarios')
          PY
      - name: Capture mapped Forge 28 API contracts
        if: always()
        shell: bash
        run: python3 tools/inspect_1144_api.py
      - name: Stock Forge28 production-only startup and clean stop
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/production_smoke_1144.py 2>&1 | tee verification-logs/production-smoke-step.log
      - name: Preserve native verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge1144-native-evidence
          path: |
            verification-logs/
            build/java8/*.json
            build/reports/
            run-java8/port-scenarios.json
            run-java8/logs/
            run-java8/crash-reports/
          retention-days: 14
          if-no-files-found: warn
