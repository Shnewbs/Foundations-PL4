name: Forge 1.16.5 installed Java 8 feature validation
on:
  push:
    paths-ignore: ['.github/workflows/**']
    branches: [mc/1.16.5]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge116-native-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/mc/1.16.5'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read publication maturity from exact checked-out source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          """Shared release maturity and explicit RC clearance policy."""
          import re
          
          
          def release_type(version):
              text = version.lower()
              if re.search(r"(?:^|[.\-_])(?:dev|snapshot|nightly)(?:[.\-_]|$)", text):
                  raise ValueError("Development snapshots are not qualified releases")
              if re.search(r"beta|(?:^|[.\-_])rc\d*(?:[.\-_]|$)|\db(?:[.\-_]|$)", text):
                  return "beta"
              if re.search(r"alpha|preview|experimental|(?:^|[.\-_])port(?:[.\-_]|$)|\da(?:[.\-_]|$)", text):
                  return "alpha"
              return "release"
          
          
          def is_rc(version):
              return bool(re.search(r"(?:^|[.\-_])rc\d*(?:[.\-_]|$)", version, re.I))
          
          
          def require_publication(status, minecraft=None, version=None):
              if not isinstance(status, dict):
                  raise ValueError("Missing exact-source build status")
              actual = status.get("version", "")
              if not actual or (version is not None and actual != version):
                  raise ValueError("Build status and release version disagree")
              if minecraft is not None and status.get("minecraft") != minecraft:
                  raise ValueError("Build status and exact Minecraft target disagree")
              maturity = release_type(actual)
              if status.get("release_channel", "").lower() == "development":
                  raise ValueError("Development channel is not publishable")
              if is_rc(actual) and status.get("rc_publication_cleared") is not True:
                  raise ValueError("RC publication has not been explicitly cleared")
              return maturity
          
          status = json.loads(Path('BUILD_STATUS.json').read_text())
          try:
              require_publication(status)
              allowed = True
          except ValueError as error:
              allowed = False
              print('Publication held:', error)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PL4_ALLOW_PUBLICATION=' + str(allowed).lower() + '\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Preserve exact source and build Java 8 artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Complete scenario suite on actual installed Forge
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native-run.log
      - name: Preserve or publish the exact passed target
        if: env.PL4_ALLOW_PUBLICATION == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TARGET=1.16.5
          test "$(git ls-remote origin refs/heads/mc/$TARGET | cut -f1)" = "$(git rev-parse HEAD)"
          VERSION=$(python3 -c 'import json; print(json.load(open("BUILD_STATUS.json"))["version"])')
          TAG="mc$TARGET-v$VERSION"
          NAME="FoundationsPL4-$TARGET-$VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            git diff --exit-code "$TAG" HEAD -- src/main build.gradle tools/java8 gradle/ gradle.properties settings.gradle
            gh release view "$TAG"
            gh release download "$TAG" --pattern "$NAME.jar" --dir published-runtime
            cmp "build/libs/$NAME-java8.jar" "published-runtime/$NAME.jar"
            echo 'Exact rebuilt runtime matches published bytes; existing tag and assets retained.'
            exit 0
          fi
          test -f "docs/releases/$VERSION.md"
          mkdir -p release-files
          cp "build/libs/$NAME-java8.jar" "release-files/$NAME.jar"
          cp "build/libs/$NAME-sources.jar" release-files/
          git archive --format=zip --output="release-files/$NAME-source.zip" HEAD
          cp .java8-toolchain/jvmdowngrader-source.zip release-files/JvmDowngrader-2.0.1-source.zip
          cp verification-logs/installed-native.log verification-logs/java8-summary.json verification-logs/port-scenarios.json build/java8/archive-check.json build/java8/toolchain.json release-files/
          git rev-parse HEAD > release-files/SOURCE_COMMIT.txt
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          git tag "$TAG"; git push origin "$TAG"
          gh release create "$TAG" release-files/* --verify-tag --prerelease --title "Foundations PL4 $TARGET $VERSION - Java 8" --notes-file "docs/releases/$VERSION.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge1165-java8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-files/
            verification-logs/
            build/java8/*.json
            run-java8/port-scenarios.json
            run-java8/crash-reports/
          retention-days: 14
          if-no-files-found: warn
