name: Forge 1.16.5 native validation
on:
  push:
    branches: [mc/1.16.5]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge116-native-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Correct deferred Forge run-task wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build.gradle');s=p.read_text();s=s.replace("tasks.named('runServer') { dependsOn tasks.named('portTestClasses') }","tasks.matching { it.name == 'runServer' }.configureEach { dependsOn tasks.named('portTestClasses') }");p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build.gradle
          if ! git diff --cached --quiet; then
            git commit -m 'Configure native server dependency after Forge creates run tasks'
            git push origin HEAD:mc/1.16.5
          fi
          git rev-parse HEAD > source-commit.txt
      - name: Build and execute all native server scenarios
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs run-scenarios
          printf 'eula=true\n' > run-scenarios/eula.txt
          printf 'server-ip=127.0.0.1\nonline-mode=false\nlevel-name=scenario-world\nlevel-type=flat\nview-distance=3\nmax-players=1\nspawn-protection=0\n' > run-scenarios/server.properties
          bash gradlew --no-daemon --console=plain clean build runServer -PportScenarios 2>&1 | tee verification-logs/native.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('run-scenarios/port-scenarios.json').read_text())
          assert report['minecraft']=='1.16.5' and report['total']==191 and report['passed']==191 and report['failed']==0,report
          assert 'PL4 SCENARIOS SUCCESS: All 191 required native scenarios passed' in Path('verification-logs/native.log').read_text()
          print('PASS all 191 native scenarios; not modern GameTests')
          PY
      - name: Publish validated exact target alpha
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version='0.2a-port.1'; tag="mc1.16.5-v$version"
          mkdir -p release-files
          cp "build/libs/FoundationsPL4-1.16.5-$version.jar" "build/libs/FoundationsPL4-1.16.5-$version-sources.jar" release-files/
          git archive --format=zip --output="release-files/FoundationsPL4-1.16.5-$version-source.zip" HEAD
          cp verification-logs/native.log "release-files/FoundationsPL4-1.16.5-$version-native-tests.log"
          cp run-scenarios/port-scenarios.json source-commit.txt release-files/
          (cd release-files && sha256sum *.jar *.zip *.log *.json source-commit.txt > SHA256SUMS.txt)
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'Existing published tag is immutable; use a new port revision.'; exit 1
          fi
          git tag "$tag"; git push origin "$tag"
          gh release create "$tag" release-files/* --verify-tag --prerelease --title "Foundations PL4 $version — Minecraft 1.16.5 Forge" --notes-file docs/releases/0.2a-port.1.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge116-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-commit.txt
            release-files/
            verification-logs/
            run-scenarios/port-scenarios.json
            run-scenarios/logs/
            build/reports/
            build/libs/
          retention-days: 14
          if-no-files-found: warn
