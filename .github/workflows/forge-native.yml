name: Forge 1.16.4 independent native validation
on:
  push:
    branches: [mc/1.16.4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge1164-native-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/mc/1.16.4'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve exact source and target settings
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git rev-parse HEAD > source-commit.txt
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
      - name: Build and execute native scenarios with explicit Java 17 profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs run-scenarios
          printf 'eula=true\n' > run-scenarios/eula.txt
          printf 'server-ip=127.0.0.1\nonline-mode=false\nlevel-name=scenario-world\nlevel-type=flat\nview-distance=3\nmax-players=1\nspawn-protection=0\n' > run-scenarios/server.properties
          bash gradlew --no-daemon --console=plain clean build runServer -PportScenarios 2>&1 | tee verification-logs/native.log
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          report=json.loads(Path('run-scenarios/port-scenarios.json').read_text())
          log=Path('verification-logs/native.log').read_text()
          assert report['minecraft']=='1.16.4' and report['total']==193 and report['passed']==193 and report['failed']==0,report
          assert 'PL4 SCENARIOS SUCCESS: All 193 required native scenarios passed' in log
          assert re.search(r'Starting minecraft server version 1\.16\.4\b',log,re.I),'Actual native Minecraft version not established'
          assert 'ModLauncher 8.1.3' in log,'Pinned launcher profile not used'
          print('PASS 193 native scenarios on Minecraft 1.16.4 / Forge 35.1.37 with explicit Java 17 launch profile')
          PY
      - name: Release remains gated on reproducible installed runtime
        run: echo 'No publication from this diagnostic job. Development launch success does not certify ordinary installed Forge 35.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge1164-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-commit.txt
            verification-logs/
            run-scenarios/port-scenarios.json
            run-scenarios/logs/
            build/reports/
            build/libs/
          retention-days: 14
          if-no-files-found: warn
