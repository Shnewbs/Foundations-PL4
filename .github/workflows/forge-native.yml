name: Forge 1.16.2 exact-source native and production validation
on:
  push:
    branches: ['mc/1.16.2']
    paths-ignore:
      - '.github/workflows/**'
      - 'tools/test_publisher_policy_1162.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge1162-native-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/mc/1.16.2'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact immutable 1.16.2 source (no transforms or branch pushes)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          TARGET=$(python3 -c 'import json; print(json.load(open("PORT_TARGET.json"))["minecraft"])')
          test "$TARGET" = '1.16.2'
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > verification-logs/SOURCE_COMMIT.txt
          sha256sum verification-logs/checked-source.zip > verification-logs/SOURCE_ARCHIVE_SHA256SUMS.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Compile and reobfuscate exact Forge 32 source for Java 8
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Exact native 195 scenarios and production-only launcher-profile startup
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native-run.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          report=json.loads(Path('verification-logs/port-scenarios.json').read_text())
          assert report['minecraft']=='1.16.2' and report['total']==195 and report['passed']==195 and report['failed']==0, report
          print('PASS: 195 native Forge32 scenarios')
          PY
          python3 tools/production_smoke.py 2>&1 | tee verification-logs/production-smoke-step.log
      - name: Retain exact JAR and runtime log digests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          if test -d build/libs; then
            find build/libs -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 -r sha256sum > verification-logs/JAR_SHA256SUMS.txt
          fi
          for file in verification-logs/build.log verification-logs/native-run.log verification-logs/port-scenarios.json verification-logs/production-smoke.json verification-logs/production-smoke.log; do
            if test -f "$file"; then sha256sum "$file"; fi
          done > verification-logs/LOG_SHA256SUMS.txt
      - name: Retain exact native results (no development publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-patch-1162-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-logs/
            build/libs/*.jar
            build/java8/*.json
            run-java8/port-scenarios.json
            run-java8/crash-reports/
            run-java8-production/crash-reports/
          retention-days: 14
          if-no-files-found: warn
