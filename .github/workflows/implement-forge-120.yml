name: Implement and verify Forge 1.20.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/implement-forge-120.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: implement-forge-120
  cancel-in-progress: false
jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: mc/1.20.1
          path: port
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply reviewed source migrations without overwriting newer work
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C port rev-parse HEAD)" = '2e57a74e6137bff1a659b371d6f0d68d1fb1fa85'
          export PL4_PORT_WORK="$RUNNER_TEMP/pl4-ports"
          mkdir -p "$PL4_PORT_WORK/base" "$PL4_PORT_WORK/toolchains/1.20.1/mdk"
          git -C port archive a76df436f7fed5513ee02f37ea361e91b9e013e2 | tar -x -C "$PL4_PORT_WORK/base"
          curl --fail --location --retry 3 'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.26/forge-1.20.1-47.4.26-mdk.zip' -o "$PL4_PORT_WORK/developer.zip"
          echo "34859392cc1eddcc05a0596d8e0af690a5fe8f17  $PL4_PORT_WORK/developer.zip" | sha1sum -c -
          unzip -q "$PL4_PORT_WORK/developer.zip" -d "$PL4_PORT_WORK/toolchains/1.20.1/mdk"
          javac -d "$PL4_PORT_WORK" control/tools/ports/RewriteCalls.java
          python3 control/tools/ports/forge17_phase1.py
          python3 control/tools/ports/forge17_phase2.py
          python3 control/tools/ports/forge17_package.py
          rsync -a --delete "$PL4_PORT_WORK/1.20.1/src/" port/src/
          cp "$PL4_PORT_WORK/1.20.1/"{build.gradle,settings.gradle,gradlew,gradlew.bat,BUILD.bat,BUILD_STATUS.json,README.md} port/
          cp "$PL4_PORT_WORK/1.20.1/gradle/wrapper/"* port/gradle/wrapper/
          cp "$PL4_PORT_WORK/1.20.1/tools/"*.java port/tools/
          cp "$PL4_PORT_WORK/1.20.1/tools/run_port_checks.py" port/tools/
          cp "$PL4_PORT_WORK/1.20.1/docs/FIELD_GUIDE.md" port/docs/
          cp "$PL4_PORT_WORK/1.20.1/docs/releases/0.2a-port.1.md" port/docs/releases/
          cd port
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle settings.gradle gradlew gradlew.bat gradle/wrapper BUILD.bat BUILD_STATUS.json README.md tools docs/FIELD_GUIDE.md docs/releases/0.2a-port.1.md
          git commit -m 'Implement native Forge 1.20.1 port with all 191 behavior fixtures'
          git push origin HEAD:mc/1.20.1
          git rev-parse HEAD > "$GITHUB_WORKSPACE/source-commit.txt"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build, reobfuscate and execute native GameTests
        shell: bash
        working-directory: port
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          bash gradlew --no-daemon --console=plain build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 191 required tests passed' verification-logs/native.log
          git archive --format=zip --output=FoundationsPL4-1.20.1-0.2a-port.1-source.zip HEAD
          sha256sum build/libs/*.jar FoundationsPL4-1.20.1-0.2a-port.1-source.zip > verification-logs/SHA256SUMS.txt
      - name: Preserve exact source and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-port-1.20.1-${{ github.run_id }}
          retention-days: 14
          path: |
            source-commit.txt
            port/verification-logs/
            port/build/libs/
            port/build/reports/
            port/build/test-results/
            port/run/logs/
            port/*-source.zip
          if-no-files-found: warn
