name: Upgrade released-beta world with two real clients
# Automatic triggers disabled; external builders and publishers only.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  released_world_upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          # Exact immutable commit currently referenced by released-beta v0.2b.0.
          # A moving/recreated tag must never silently change the migration baseline.
          ref: 7c7c07ff5ae0bce4990bf2f0a739841161ce8f8c
          path: baseline
      - uses: actions/checkout@v4
        with:
          # The workflow-triggering commit is the actual candidate, never an old frozen snapshot.
          ref: ${{ github.sha }}
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: '**/*.gradle*'
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Check independent migration evidence regressions
        run: |
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_verify_upgrade_evidence.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_release_binary_preflight.py'
      - name: Verify actual immutable GitHub published-beta production JAR bytes (not yet installed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/immutable-baseline
          gh api repos/Shnewbs/Foundations-PL4/git/ref/tags/v0.2b.0 > results/immutable-baseline/tag-ref.json
          gh api repos/Shnewbs/Foundations-PL4/releases/tags/v0.2b.0 > results/immutable-baseline/release.json
          gh release download v0.2b.0 -R Shnewbs/Foundations-PL4 --pattern 'FoundationsPL4-1.21.1-0.2b.0.jar' --dir results/immutable-baseline
          python3 control/tools/multiplayer-probe/release_binary_preflight.py \
            --release-json results/immutable-baseline/release.json \
            --tag-ref-json results/immutable-baseline/tag-ref.json \
            --jar results/immutable-baseline/FoundationsPL4-1.21.1-0.2b.0.jar \
            --receipt results/immutable-baseline/verified-binary-preflight.json
      - name: Save actual released-beta world with both player inventories
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 control/tools/multiplayer-probe/run_probe.py baseline results/seed --phase seed
      - name: Open copied saved world with candidate server and clients
        run: xvfb-run -a -s '-screen 0 1280x960x24' python3 control/tools/multiplayer-probe/run_probe.py candidate results/restore --phase restore --restore-world multiplayer-seed-server/run
      - name: Require immutable-source and retained-world-byte migration evidence
        env:
          BASELINE_SOURCE_SHA: 7c7c07ff5ae0bce4990bf2f0a739841161ce8f8c
          CANDIDATE_SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 control/tools/multiplayer-probe/verify_upgrade_evidence.py results/seed results/restore --baseline "$BASELINE_SOURCE_SHA" --candidate "$CANDIDATE_SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-client-beta-world-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            multiplayer-*/run/logs/
            multiplayer-*/run/crash-reports/
          retention-days: 14
          if-no-files-found: error
