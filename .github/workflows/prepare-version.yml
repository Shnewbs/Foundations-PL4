name: Audit retired 1.21.1 prepare-version.yml workflow (read-only)
on:
  push:
    branches: ['mc/1.21.1']
    paths: ['.github/workflows/prepare-version.yml']
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject obsolete source rewrites and direct publication
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/prepare-version.yml').read_text(encoding='utf-8')
          declarations = source.split('jobs:', 1)[0]
          assert "branches: ['mc/1.21.1']" in declarations
          assert 'contents: read' in declarations
          assert 'contents:' + ' write' not in declarations
          assert 'workflow_' + 'dispatch:' not in declarations
          assert 'workflow_' + 'run:' not in declarations
          assert 'release:' not in declarations
          for forbidden in ('secrets' + '.', 'gh' + ' release', 'git' + ' push', '--' + 'clobber', 'upload_' + 'curseforge.py', 'api.' + 'curseforge.com'):
              assert forbidden not in source, forbidden
          print('PASS: retired mc/1.21.1 prepare-version.yml is read only; no source rewriting or publication.')
          print('Use the main pinned hourly-builds.yml for exact native validation; RC publication requires explicit clearance.')
          PY
