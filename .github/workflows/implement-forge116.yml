name: Implement and validate Forge 1.16.5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/implement-forge116.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: implement-forge116
  cancel-in-progress: false
jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: mc/1.16.5
          path: port
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply native source and fixture migrations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git -C port rev-parse HEAD)" = '2e57a74e6137bff1a659b371d6f0d68d1fb1fa85'
          export PL4_PORT_WORK="$RUNNER_TEMP/pl4-ports"
          mkdir -p "$PL4_PORT_WORK/1.18.2" "$PL4_PORT_WORK/toolchains/1.18.2" "$PL4_PORT_WORK/toolchains/1.16.5"
          git -C port archive e002c37c71d1e5fc4389a7df4d4e7cf02ad9b917 | tar -x -C "$PL4_PORT_WORK/1.18.2"
          gh api "repos/$GH_REPO/actions/artifacts/11613397098/zip" > "$PL4_PORT_WORK/classpath118.zip"
          gh api "repos/$GH_REPO/actions/artifacts/11612872998/zip" > "$PL4_PORT_WORK/classpath116.zip"
          unzip -q "$PL4_PORT_WORK/classpath118.zip" -d "$PL4_PORT_WORK/toolchains/1.18.2"
          unzip -q "$PL4_PORT_WORK/classpath116.zip" -d "$PL4_PORT_WORK/toolchains/1.16.5"
          python3 control/tools/ports/forge116_names.py
          python3 control/tools/ports/forge116_native.py
          python3 control/tools/ports/forge116_tests.py
          python3 control/tools/ports/forge116_package.py
          rsync -a --delete "$PL4_PORT_WORK/1.16.5/src/" port/src/
          cp "$PL4_PORT_WORK/1.16.5/"{build.gradle,settings.gradle,gradlew,gradlew.bat,BUILD.bat,BUILD_STATUS.json,README.md,release-version.txt} port/
          cp "$PL4_PORT_WORK/1.16.5/gradle/wrapper/"* port/gradle/wrapper/
          cp "$PL4_PORT_WORK/1.16.5/tools/"*.java port/tools/
          cp "$PL4_PORT_WORK/1.16.5/tools/run_port_checks.py" port/tools/
          cp "$PL4_PORT_WORK/1.16.5/docs/FIELD_GUIDE.md" port/docs/
          cp "$PL4_PORT_WORK/1.16.5/docs/releases/0.2a-port.1.md" port/docs/releases/
          cd port
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle settings.gradle gradlew gradlew.bat gradle/wrapper BUILD.bat BUILD_STATUS.json README.md release-version.txt tools docs/FIELD_GUIDE.md docs/releases/0.2a-port.1.md
          git commit -m 'Implement native Forge 1.16.5 and isolated 191-scenario harness'
          git push origin HEAD:mc/1.16.5
          git rev-parse HEAD > source-commit.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build runtime and execute disposable native scenario server
        shell: bash
        working-directory: port
        run: |
          set -euo pipefail
          mkdir -p verification-logs run-scenarios
          printf 'eula=true\n' > run-scenarios/eula.txt
          printf 'server-ip=127.0.0.1\nonline-mode=false\nlevel-name=scenario-world\nlevel-type=flat\nview-distance=3\nmax-players=1\nspawn-protection=0\n' > run-scenarios/server.properties
          bash gradlew --no-daemon --console=plain clean build runServer -PportScenarios 2>&1 | tee verification-logs/native.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('run-scenarios/port-scenarios.json').read_text())
          assert report['minecraft']=='1.16.5' and report['total']==191 and report['passed']==191 and report['failed']==0,report
          assert 'PL4 SCENARIOS SUCCESS: All 191 required native scenarios passed' in Path('verification-logs/native.log').read_text()
          print('PASS all 191 native 1.16.5 scenarios; not modern GameTests')
          PY
          git archive --format=zip --output=FoundationsPL4-1.16.5-0.2a-port.1-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge116-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            port/source-commit.txt
            port/verification-logs/
            port/run-scenarios/port-scenarios.json
            port/run-scenarios/logs/
            port/build/libs/
            port/build/reports/
            port/*-source.zip
          retention-days: 14
          if-no-files-found: warn
