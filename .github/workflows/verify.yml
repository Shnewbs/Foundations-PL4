name: Verify source and native build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run offline regression checks
        run: python3 tools/run_offline_checks.py
      - name: Compile and run native GameTests
        run: bash gradlew --no-daemon --console=plain clean build runGameTestServer
