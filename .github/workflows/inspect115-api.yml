name: Inspect exact Forge 31 port API
on:
  push:
    branches: [mc/1.15.2]
    paths: ['tools/inspect_1152_api.py', '.github/workflows/inspect115-api.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve exact native mapped API independently of PL4 compilation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          bash gradlew --no-daemon --console=plain java8Classpath 2>&1 | tee verification-logs/api-setup.log
          python3 tools/inspect_1152_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native115-api-${{ github.run_id }}
          path: verification-logs/
          retention-days: 14
          if-no-files-found: error
