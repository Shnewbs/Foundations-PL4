name: Implement older Java 17 Forge ports
on:
  push:
    branches: [main]
    paths: ['.github/workflows/implement-forge-older17.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: implement-forge-older17
  cancel-in-progress: false
jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        mc: ['1.19.2','1.18.2']
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: mc/${{ matrix.mc }}
          path: port
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply reviewed target-specific source migrations
        shell: bash
        env:
          MC: ${{ matrix.mc }}
        run: |
          set -euo pipefail
          test "$(git -C port rev-parse HEAD)" = '2e57a74e6137bff1a659b371d6f0d68d1fb1fa85'
          export PL4_PORT_WORK="$RUNNER_TEMP/pl4-ports"
          mkdir -p "$PL4_PORT_WORK/base"
          git -C port archive b5bae698f74d4d3275e30ddab74fd245d541b31e | tar -x -C "$PL4_PORT_WORK/base"
          python3 "$PL4_PORT_WORK/base/tools/ports/repair_forge120.py"
          python3 control/tools/ports/forge_pre120.py
          if [ "$MC" = '1.18.2' ]; then python3 control/tools/ports/forge118.py; fi
          python3 control/tools/ports/configure_forge17.py "$MC"
          rsync -a --delete "$PL4_PORT_WORK/$MC/src/" port/src/
          cp "$PL4_PORT_WORK/$MC/"{build.gradle,settings.gradle,gradlew,gradlew.bat,BUILD.bat,BUILD_STATUS.json,README.md,release-version.txt} port/
          cp "$PL4_PORT_WORK/$MC/gradle/wrapper/"* port/gradle/wrapper/
          cp "$PL4_PORT_WORK/$MC/tools/"*.java port/tools/
          cp "$PL4_PORT_WORK/$MC/tools/run_port_checks.py" port/tools/
          cp "$PL4_PORT_WORK/$MC/docs/FIELD_GUIDE.md" port/docs/
          cp "$PL4_PORT_WORK/$MC/docs/releases/0.2a-port.1.md" port/docs/releases/
          cd port
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle settings.gradle gradlew gradlew.bat gradle/wrapper BUILD.bat BUILD_STATUS.json README.md release-version.txt tools docs/FIELD_GUIDE.md docs/releases/0.2a-port.1.md
          git commit -m "Implement native Forge $MC port with all 191 behavior fixtures"
          git push origin "HEAD:mc/$MC"
          git rev-parse HEAD > source-commit.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and execute all native GameTests
        shell: bash
        working-directory: port
        env:
          MC: ${{ matrix.mc }}
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          bash gradlew --no-daemon --console=plain build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 191 required tests passed' verification-logs/native.log
          git archive --format=zip --output="FoundationsPL4-$MC-0.2a-port.1-source.zip" HEAD
          sha256sum build/libs/*.jar *-source.zip > verification-logs/SHA256SUMS.txt
      - name: Preserve exact source and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-port-${{ matrix.mc }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            port/source-commit.txt
            port/verification-logs/
            port/build/libs/
            port/build/reports/
            port/build/test-results/
            port/run/logs/
            port/*-source.zip
          retention-days: 14
          if-no-files-found: warn
