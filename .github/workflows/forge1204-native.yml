name: Forge 1.20.4 exact native port
on:
  push:
    branches: [mc/1.20.4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge1204-native
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare exact native source and commit revision
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_forge1204.py
          python3 tools/backport_forge1204_native.py
          git diff --check
          git add src/main build.gradle BUILD_STATUS.json PORT_TARGET.json README.md docs/FIELD_GUIDE.md docs/releases/0.2a-port.1.md tools/run_port_checks.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Prepare exact Minecraft 1.20.4 / Forge 49.2.8 native source'
            git push origin HEAD:mc/1.20.4
          fi
          git diff --exit-code
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/source-at-build.zip HEAD
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
      - name: Compile, reobfuscate and run all 191 actual GameTests
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 191 required tests passed' verification-logs/native.log
      - name: Publish verified exact-version JAR and matching source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target=1.20.4;version=$(python3 -c 'import json;print(json.load(open("BUILD_STATUS.json"))["version"])')
          name="FoundationsPL4-$target-$version";tag="mc$target-v$version"
          test "$(git ls-remote origin "refs/heads/mc/$target" | cut -f1)" = "$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git diff --exit-code "$tag" HEAD -- src/main build.gradle
            if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          else
            git tag "$tag";git push origin "$tag"
          fi
          mkdir -p release-files
          cp "build/libs/$name.jar" "build/libs/$name-sources.jar" release-files/
          git archive --format=zip --output="release-files/$name-source.zip" "$tag"
          cp verification-logs/native.log "release-files/$name-native-tests.log"
          git rev-parse "$tag^{commit}" > release-files/SOURCE_COMMIT.txt
          (cd release-files && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          gh release create "$tag" release-files/* --verify-tag --prerelease --title "Foundations PL4 $target $version (Forge 49.2.8 alpha)" --notes-file "docs/releases/$version.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge1204-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-files/
            verification-logs/
            run/logs/
            build/reports/
          retention-days: 14
          if-no-files-found: warn
