name: Forge 1.20.4 exact native port
on:
  push:
    paths-ignore:
      - '.github/workflows/**'
      - 'tools/test_publisher_policy_1204.py'
    branches: [mc/1.20.4]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge1204-native
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Record exact reviewed source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/source-at-build.zip HEAD
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          sha256sum verification-logs/source-at-build.zip > verification-logs/SOURCE_ARCHIVE_SHA256SUMS.txt
      - name: Compile, reobfuscate and run all 191 actual GameTests
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 191 required tests passed' verification-logs/native.log
      - name: Hash native log and exact production artifacts
        shell: bash
        run: |
          set -euo pipefail
          sha256sum verification-logs/native.log > verification-logs/LOG_SHA256SUMS.txt
          test -n "$(find build/libs -maxdepth 1 -type f -name '*.jar' -print -quit)"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 sha256sum > verification-logs/JAR_SHA256SUMS.txt
          sha256sum -c verification-logs/LOG_SHA256SUMS.txt
          sha256sum -c verification-logs/JAR_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge1204-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/libs/
            verification-logs/
            run/logs/
            build/reports/
          retention-days: 14
          if-no-files-found: warn
