name: Forge 1.17.1 installed full feature validation
on:
  push:
    branches: [mc/1.17.1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge117-native-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/mc/1.17.1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile exact target and isolated combined test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          git rev-parse HEAD > verification-logs/source-commit.txt
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Verify production identity, all scenarios and production-only boot
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_installed117.py 2>&1 | tee verification-logs/native.log
      - name: Publish only the passed target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/mc/1.17.1 | cut -f1)" = "$(git rev-parse HEAD)"
          version=$(python3 -c 'import json; print(json.load(open("BUILD_STATUS.json"))["version"])')
          tag="mc1.17.1-v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            git diff --exit-code "$tag" HEAD -- src/main build.gradle tools/installed117.gradle gradle/
            gh release view "$tag"; exit 0
          fi
          mkdir -p release-files
          cp "build/libs/FoundationsPL4-1.17.1-$version.jar" "build/libs/FoundationsPL4-1.17.1-$version-sources.jar" release-files/
          git archive --format=zip --output="release-files/FoundationsPL4-1.17.1-$version-source.zip" HEAD
          cp verification-logs/installed-scenarios.log verification-logs/production-boot.log verification-logs/installed-summary.json verification-logs/port-scenarios.json verification-logs/source-commit.txt release-files/
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          git tag "$tag"; git push origin "$tag"
          gh release create "$tag" release-files/* --verify-tag --prerelease --title "Foundations PL4 1.17.1 $version" --notes-file "docs/releases/$version.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge117-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-files/
            verification-logs/
            run-installed-117/port-scenarios.json
            run-installed-117/crash-reports/
            build/reports/
          retention-days: 14
          if-no-files-found: warn
