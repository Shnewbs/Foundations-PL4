name: Forge 1.17.1 full feature port validation
on:
  push:
    branches: [mc/1.17.1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge117-native-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/mc/1.17.1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare exact native target
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_1171.py
          git diff --check
          git add src build.gradle BUILD_STATUS.json tools/run_port_checks.py docs/FIELD_GUIDE.md
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Configure exact 1.17.1 full feature source and native tags'
            git push origin HEAD:mc/1.17.1
          fi
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          git rev-parse HEAD > verification-logs/source-commit.txt
      - name: Native compilation, rules and full behavior suite
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 193 required tests passed' verification-logs/native.log
      - name: Publish only the passing exact target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/mc/1.17.1 | cut -f1)" = "$(git rev-parse HEAD)"
          version='0.2a-port.1'; tag="mc1.17.1-v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)"
            gh release view "$tag"; exit 0
          fi
          mkdir -p release-files
          cp "build/libs/FoundationsPL4-1.17.1-$version.jar" "build/libs/FoundationsPL4-1.17.1-$version-sources.jar" release-files/
          git archive --format=zip --output="release-files/FoundationsPL4-1.17.1-$version-source.zip" HEAD
          cp verification-logs/native.log verification-logs/source-commit.txt release-files/
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          git tag "$tag"; git push origin "$tag"
          gh release create "$tag" release-files/* --verify-tag --prerelease --title "Foundations PL4 1.17.1 $version" --notes-file "docs/releases/$version.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge117-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-files/
            verification-logs/
            run/logs/
            build/reports/
          retention-days: 14
          if-no-files-found: warn
