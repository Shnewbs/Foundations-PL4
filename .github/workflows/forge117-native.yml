name: Forge 1.17.1 exact-source installed native and production validation
on:
  push:
    paths-ignore: ['.github/workflows/**', 'tools/test_publisher_policy_1171.py']
    branches: [mc/1.17.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge117-native-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/mc/1.17.1'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact immutable 1.17.1 source without mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(python3 -c 'import json; print(json.load(open("BUILD_STATUS.json"))["minecraft"])')" = '1.17.1'
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > verification-logs/source-commit.txt
          sha256sum verification-logs/checked-source.zip > verification-logs/SOURCE_ARCHIVE_SHA256SUMS.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile exact target and isolated combined test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          git rev-parse HEAD > verification-logs/source-commit.txt
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Verify production identity, all scenarios and production-only boot
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_installed117.py 2>&1 | tee verification-logs/native.log
      - name: Retain exact production JAR and installed runtime digests
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          if test -d build/libs; then
            find build/libs -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 -r sha256sum > verification-logs/JAR_SHA256SUMS.txt
          fi
          for file in verification-logs/build.log verification-logs/native.log verification-logs/installed-scenarios.log verification-logs/production-boot.log verification-logs/installed-summary.json verification-logs/port-scenarios.json; do
            if test -f "$file"; then sha256sum "$file"; fi
          done > verification-logs/LOG_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge117-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-logs/
            build/libs/*.jar
            run-installed-117/port-scenarios.json
            run-installed-117/crash-reports/
            build/reports/
          retention-days: 14
          if-no-files-found: warn
