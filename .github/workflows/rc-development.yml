name: Align and validate all RC development ports
# Quarantined endpoints are filtered once per cycle; exact-port fixtures verify blocked routing.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rc-development.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rc-development-alignment
  cancel-in-progress: true
jobs:
  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - minecraft: '1.14.4'
            branch: 'mc/1.14.4'
            java: '17'
          - minecraft: '1.15.2'
            branch: 'mc/1.15.2'
            java: '17'
          - minecraft: '1.16.1'
            branch: 'mc/1.16.1'
            java: '17'
          - minecraft: '1.16.2'
            branch: 'mc/1.16.2'
            java: '17'
          - minecraft: '1.16.3'
            branch: 'mc/1.16.3'
            java: '17'
          - minecraft: '1.16.4'
            branch: 'mc/1.16.4'
            java: '17'
          - minecraft: '1.16.5'
            branch: 'mc/1.16.5'
            java: '17'
          - minecraft: '1.17.1'
            branch: 'mc/1.17.1'
            java: '17'
          - minecraft: '1.18.1'
            branch: 'mc/1.18.1'
            java: '17'
          - minecraft: '1.18.2'
            branch: 'mc/1.18.2'
            java: '17'
          - minecraft: '1.19'
            branch: 'mc/1.19'
            java: '17'
          - minecraft: '1.19.1'
            branch: 'mc/1.19.1'
            java: '17'
          - minecraft: '1.19.2'
            branch: 'mc/1.19.2'
            java: '17'
          - minecraft: '1.19.3'
            branch: 'mc/1.19.3'
            java: '17'
          - minecraft: '1.19.4'
            branch: 'mc/1.19.4'
            java: '17'
          - minecraft: '1.20'
            branch: 'mc/1.20'
            java: '17'
          - minecraft: '1.20.1'
            branch: 'mc/1.20.1'
            java: '17'
          - minecraft: '1.20.2'
            branch: 'mc/1.20.2'
            java: '17'
          - minecraft: '1.20.4'
            branch: 'mc/1.20.4'
            java: '17'
          - minecraft: '1.21.1'
            branch: 'main'
            java: '21'
          - minecraft: '26.1.2'
            branch: 'mc/26.1.2'
            java: '25'
          - minecraft: '26.3'
            branch: 'mc/26.3'
            java: '25'
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: port
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: matrix.java == '17'
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: port/**/*.gradle*
      - name: Prepare common unpublished RC development baseline
        run: python3 control/tools/ports/prepare_rc_candidate.py port '${{ matrix.minecraft }}'
      - name: Exact-target native validation
        run: python3 control/tools/ports/validate_rc_candidate.py port
      - name: Save only passing source on its existing version branch
        working-directory: port
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          set -euo pipefail
          parent=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/net/foundations/pl4/core/TransferRules.java tools/R16RegressionTests.java src/main/java/net/foundations/pl4/NetworkEngine.java src/main/java/net/foundations/pl4/TransferEngine.java src/main/java/net/foundations/pl4/client/WirelessStorageScreen.java src/main/resources/assets/foundations_pl4/guide/en_us.json docs/FIELD_GUIDE.md build.gradle BUILD_STATUS.json release-version.txt docs/releases/0.2.0-rc.1-dev.md .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m 'Align validated RC development performance baseline; acceptance still pending'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          (cd verification-logs && sha256sum checked-source.zip > source-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UNRELEASED-RC-development-${{ matrix.minecraft }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            port/verification-logs/
            port/build/libs/*.jar
            port/build/reports/
            port/build/test-results/
            port/run/logs/
            port/run/crash-reports/
          retention-days: 14
          if-no-files-found: warn
  legacy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.12.2', '1.6.4']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mc/${{ matrix.minecraft }}
      - uses: actions/setup-java@v4
        if: matrix.minecraft == '1.6.4'
        with:
          distribution: zulu
          java-version: '7'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        if: matrix.minecraft == '1.6.4'
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate actual legacy runtime subset
        shell: bash
        run: |
          set -euo pipefail
          bash tools/validate_legacy_fluids.sh
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          echo 'Legacy transport subset verified; modern feature parity and RC clearance remain incomplete.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-baseline-${{ matrix.minecraft }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-logs/
            run-legacy/legacy-scenarios.json
            build/libs/
          retention-days: 14
          if-no-files-found: warn
