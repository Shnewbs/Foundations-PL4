name: Installed 1.21.1 released-beta JAR server smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/installed-beta-binary-smoke.yml'
      - 'tools/multiplayer-probe/installed_binary_smoke.py'
      - 'tools/multiplayer-probe/test_installed_binary_smoke.py'
      - 'tools/multiplayer-probe/exact_native_candidate.py'
      - 'tools/multiplayer-probe/test_exact_native_candidate.py'
  workflow_dispatch:
permissions:
  contents: read
  # The installed-candidate gate reads a retained successful native artifact.
  actions: read
concurrency:
  group: pl4-installed-beta-jar-native-smoke
  # This is isolated non-publishing acceptance; supersede earlier *probe-only*
  # runs after source/test changes. Hourly pinned native builds remain separate.
  cancel-in-progress: true
jobs:
  installed_release_server:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: control/**/*.gradle*
      - name: Check probe isolation and adversarial receipt regressions
        run: python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_installed_binary_smoke.py'
      - name: Download and revalidate immutable public released-beta JAR bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/immutable-baseline
          gh api repos/Shnewbs/Foundations-PL4/git/ref/tags/v0.2b.0 > results/immutable-baseline/tag-ref.json
          gh api repos/Shnewbs/Foundations-PL4/releases/tags/v0.2b.0 > results/immutable-baseline/release.json
          gh release download v0.2b.0 -R Shnewbs/Foundations-PL4 --pattern 'FoundationsPL4-1.21.1-0.2b.0.jar' --dir results/immutable-baseline
          python3 control/tools/multiplayer-probe/release_binary_preflight.py \
            --release-json results/immutable-baseline/release.json \
            --tag-ref-json results/immutable-baseline/tag-ref.json \
            --jar results/immutable-baseline/FoundationsPL4-1.21.1-0.2b.0.jar \
            --receipt results/immutable-baseline/verified-binary-preflight.json
      - name: Install genuine released JAR in isolated probe-only NeoForge runtime
        run: |
          python3 control/tools/multiplayer-probe/installed_binary_smoke.py prepare \
            --checkout control \
            --jar results/immutable-baseline/FoundationsPL4-1.21.1-0.2b.0.jar \
            --output installed-runtime \
            --sha256 7fa14351e1bbf039846afba040e4b66ce16b98db64103f1b33fc8ce14df0c229
      - name: Run native dedicated server with installed released-beta production JAR
        run: |
          python3 control/tools/multiplayer-probe/installed_binary_smoke.py run \
            --output installed-runtime --timeout-seconds 1500
      - name: Preserve installed-runtime evidence even on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-released-beta-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/immutable-baseline/tag-ref.json
            results/immutable-baseline/release.json
            results/immutable-baseline/verified-binary-preflight.json
            installed-runtime/prepared-installation.json
            installed-runtime/installed-server-proof.json
            installed-runtime/installed-server-receipt.json
            installed-runtime/installed-server.log
            installed-runtime/run/logs/
            installed-runtime/run/crash-reports/
          retention-days: 14
          if-no-files-found: warn

  installed_candidate_server:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: control/**/*.gradle*
      - name: Check exact-source retained native candidate provenance regressions
        run: |
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_exact_native_candidate.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_installed_binary_smoke.py'
      - name: Retrieve independently successful cached-alias revocation 200-case native candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/pinned-native
          gh api repos/Shnewbs/Foundations-PL4/actions/artifacts/12912977020 > results/pinned-native/artifact-metadata.json
          curl --fail --show-error --silent --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Shnewbs/Foundations-PL4/actions/artifacts/12912977020/zip" \
            --output results/pinned-native/native-artifact.zip
          python3 control/tools/multiplayer-probe/exact_native_candidate.py \
            --artifact-zip results/pinned-native/native-artifact.zip \
            --artifact-metadata results/pinned-native/artifact-metadata.json \
            --artifact-sha256 1c34154776747f71efb658f5722a3a811d9647c91c2b8bc24d92f7e4b3816069 \
            --source-sha 08dee98707765be3a8fbe44150c8bbf39cabd5cf \
            --jar-sha256 ed6e71a2a57b6ec3dd5d1fe8acd0149784ea6594008af7d9c0fc03c4cf1cf38b \
            --expected-native-tests 200 \
            --output results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar
      - name: Install exact candidate native-qualified production JAR in isolated runtime
        run: |
          python3 control/tools/multiplayer-probe/installed_binary_smoke.py prepare \
            --checkout control \
            --jar results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar \
            --output installed-candidate-runtime \
            --sha256 ed6e71a2a57b6ec3dd5d1fe8acd0149784ea6594008af7d9c0fc03c4cf1cf38b
      - name: Run genuine candidate production binary in dedicated native server
        run: |
          python3 control/tools/multiplayer-probe/installed_binary_smoke.py run \
            --output installed-candidate-runtime --timeout-seconds 1500
      - name: Preserve candidate artifact identity and native server proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-pinned-candidate-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/pinned-native/artifact-metadata.json
            results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar.provenance.json
            installed-candidate-runtime/prepared-installation.json
            installed-candidate-runtime/installed-server-proof.json
            installed-candidate-runtime/installed-server-receipt.json
            installed-candidate-runtime/installed-server.log
            installed-candidate-runtime/run/logs/
            installed-candidate-runtime/run/crash-reports/
          retention-days: 14
          if-no-files-found: warn
