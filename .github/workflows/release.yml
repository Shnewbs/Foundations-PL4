name: Audit retired 1.20 wrong-target release publisher
on:
  push:
    branches: ['mc/1.20']
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - '.github/workflows/forge120-native.yml'
      - 'tools/test_publisher_policy_120.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject unqualified development publication and preserve native source
        run: python3 -m unittest -v tools/test_publisher_policy_120.py
