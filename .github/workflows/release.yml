name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish version
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify tag matches mod version
        id: version
        shell: pwsh
        run: |
          $properties = & .\gradlew.bat --no-daemon --console=plain properties
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the Gradle project version."
          }
          $versionLine = $properties | Where-Object { $_ -match '^version:\s+' } | Select-Object -First 1
          if (-not $versionLine) {
            throw "Gradle did not report a project version."
          }
          $version = $versionLine -replace '^version:\s+', ''
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match project version '$version' (expected '$expectedTag')."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build and run native GameTests
        run: .\gradlew.bat --no-daemon --console=plain clean build runGameTestServer

      - name: Prepare checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $jar = "build/libs/FoundationsPL4-1.21.1-$env:VERSION.jar"
          $sources = "build/libs/FoundationsPL4-1.21.1-$env:VERSION-sources.jar"
          foreach ($file in @($jar, $sources)) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Expected release artifact was not produced: $file"
            }
          }
          $artifacts = @($jar, $sources)
          $hashes = foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $hashes | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          "build/libs/FoundationsPL4-1.21.1-$env:VERSION.jar"
          "build/libs/FoundationsPL4-1.21.1-$env:VERSION-sources.jar"
          "SHA256SUMS.txt"
          --verify-tag
          --title "Foundations PL4 $env:VERSION"
          --generate-notes
