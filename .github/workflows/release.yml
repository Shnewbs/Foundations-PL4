name: Audit retired 1.17.1 branch publishers
on:
  push:
    branches: ['mc/1.17.1']
    paths:
      - '.github/workflows/forge117-native.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - 'tools/test_publisher_policy_1171.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require exact-source validation without branch-local publication
        run: python3 -m unittest -v tools/test_publisher_policy_1171.py
