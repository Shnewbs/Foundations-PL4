name: Guarded exact-target 26.3 RC release
on:
  push:
    branches: ['mc/26.3']
    paths: ['.github/workflows/release.yml', '.github/workflows/port-26.yml', '.github/workflows/curseforge-26.yml', '.github/workflows/publish-port-26.yml', 'tools/release_263_policy.py', 'tools/test_release_263_policy.py']
    tags: ['mc26.3-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pl4-26-3-immutable-release
  cancel-in-progress: false
jobs:
  policy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit all 26.3 publishing paths and exact tag policy
        run: |
          python3 tools/test_release_263_policy.py
          python3 tools/release_263_policy.py audit
  release:
    needs: policy-audit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mc26.3-v')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Require explicitly cleared exact-source RC tag
        shell: pwsh
        run: python tools/release_263_policy.py preflight
      - name: Run offline regressions
        shell: pwsh
        run: python tools/run_offline_checks.py
      - name: Run actual 26.3 native GameTests and count verification
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon --console=plain clean build runGameTestServer 2>&1 | Tee-Object -FilePath native-26.3.log
          if ($LASTEXITCODE -ne 0) { throw "Native build/GameTests failed" }
          python tools/verify_native_port_run.py native-26.3.log
          if ($LASTEXITCODE -ne 0) { throw "Native count/evidence mismatch" }
      - name: Bind exact 26.3 JAR, sources and source archive checksums
        shell: pwsh
        run: python tools/release_263_policy.py package
      - name: Require immutable tag and prove new release does not exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content BUILD_STATUS.json | ConvertFrom-Json).version
          $tag = "mc26.3-v$v"
          $remote = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0 -or -not $remote) { throw "Remote tag missing or unreachable" }
          git fetch origin "refs/tags/$($tag):refs/tags/$($tag)"
          if ($LASTEXITCODE -ne 0) { throw "Tag fetch failed" }
          $tagSha = git rev-parse "$($tag)^{commit}"
          if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:GITHUB_SHA) { throw "Tag/source mismatch" }
          $response = (gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) { throw "Existing release; never overwrite" }
          if ($response -notmatch 'HTTP 404') { throw "Release absence not proven" }
      - name: Publish only NEW exact-source RC beta GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/release_263_policy.py verify
          if ($LASTEXITCODE -ne 0) { throw "Exact artifact verification failed" }
          $v = (Get-Content BUILD_STATUS.json | ConvertFrom-Json).version
          $tag = "mc26.3-v$v"
          $assets = @("build/libs/FoundationsPL4-26.3-$v.jar", "build/libs/FoundationsPL4-26.3-$v-sources.jar", "build/libs/FoundationsPL4-26.3-$v-source.zip", "build/libs/SHA256SUMS.txt")
          $notes = "docs/releases/$v.md"
          if (Test-Path $notes) {
            gh release create $tag @assets --verify-tag --title "Foundations PL4 26.3 $v" --prerelease --latest=false --notes-file $notes
          } else {
            gh release create $tag @assets --verify-tag --title "Foundations PL4 26.3 $v" --prerelease --latest=false --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Uncertain release result: inspect existing receipts before retry" }
          # Only main curseforge.yml reconciles eligible tag uploads.
