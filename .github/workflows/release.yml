name: Audit retired 1.16.2 branch publishers
on:
  push:
    branches: ['mc/1.16.2']
    paths:
      - '.github/workflows/forge-native.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - 'tools/test_publisher_policy_1162.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exact Java 8 native and immutable publication boundaries
        run: python3 -m unittest -v tools/test_publisher_policy_1162.py
