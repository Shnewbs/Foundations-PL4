name: Audit retired 1.20.1 branch-native and release publishers
on:
  push:
    branches: ['mc/1.20.1']
    paths:
      - '.github/workflows/forge-port.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - 'tools/test_publisher_policy_1201.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject branch development publications and wrong-version assets
        run: python3 -m unittest -v tools/test_publisher_policy_1201.py
