name: Audit retired 1.18.2 branch publishers
on:
  push:
    branches: ['mc/1.18.2']
    paths:
      - '.github/workflows/forge118-native.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - 'tools/test_publisher_policy_1182.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check no automatic source writes, GitHub release or direct CurseForge upload
        run: python3 -m unittest -v tools/test_publisher_policy_1182.py
