name: Audit retired 1.19.2 wrong-target release publisher
on:
  push:
    branches: ['mc/1.19.2']
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - 'tools/test_publisher_policy_1192.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require immutable RC publication only through qualified exact-target paths
        run: python3 -m unittest -v tools/test_publisher_policy_1192.py
