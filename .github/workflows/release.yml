name: Audit retired 1.15.2 branch publishers
on:
  push:
    branches: ['mc/1.15.2']
    paths:
      - '.github/workflows/forge-native.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - 'tools/test_publisher_policy_1152.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable native source and no unsafe branch publication
        run: python3 -m unittest -v tools/test_publisher_policy_1152.py
