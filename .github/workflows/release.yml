name: Build and release

on:
  push:
    paths-ignore: ['.github/workflows/**']
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish version
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read publication maturity from exact checked-out source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          """Shared release maturity and explicit RC clearance policy."""
          import re


          def release_type(version):
              text = version.lower()
              if re.search(r"(?:^|[.\-_])(?:dev|snapshot|nightly)(?:[.\-_]|$)", text):
                  raise ValueError("Development snapshots are not qualified releases")
              if re.search(r"beta|(?:^|[.\-_])rc\d*(?:[.\-_]|$)|\db(?:[.\-_]|$)", text):
                  return "beta"
              if re.search(r"alpha|preview|experimental|(?:^|[.\-_])port(?:[.\-_]|$)|\da(?:[.\-_]|$)", text):
                  return "alpha"
              return "release"


          def is_rc(version):
              return bool(re.search(r"(?:^|[.\-_])rc\d*(?:[.\-_]|$)", version, re.I))


          def require_publication(status, minecraft=None, version=None):
              if not isinstance(status, dict):
                  raise ValueError("Missing exact-source build status")
              actual = status.get("version", "")
              if not actual or (version is not None and actual != version):
                  raise ValueError("Build status and release version disagree")
              if minecraft is not None and status.get("minecraft") != minecraft:
                  raise ValueError("Build status and exact Minecraft target disagree")
              maturity = release_type(actual)
              if status.get("release_channel", "").lower() == "development":
                  raise ValueError("Development channel is not publishable")
              if is_rc(actual) and status.get("rc_publication_cleared") is not True:
                  raise ValueError("RC publication has not been explicitly cleared")
              return maturity

          status = json.loads(Path('BUILD_STATUS.json').read_text())
          try:
              if status.get("loader") != "Forge":
                  raise ValueError("Exact Forge loader required")
              channel = str(status.get("release_channel", "")).lower()
              if channel not in ("alpha", "beta", "release"):
                  raise ValueError("Unclassified publication channel")
              require_publication(status, minecraft="1.6.4")
              if is_rc(status["version"]) and channel != "beta":
                  raise ValueError("RC publication requires beta channel")
              allowed = True
          except ValueError as error:
              allowed = False
              print('Publication held:', error)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PL4_ALLOW_PUBLICATION=' + str(allowed).lower() + '\n')
          PY
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify tag matches mod version
        id: version
        shell: pwsh
        run: |
          $properties = & .\gradlew.bat --no-daemon --console=plain properties
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the Gradle project version."
          }
          $versionLine = $properties | Where-Object { $_ -match '^version:\s+' } | Select-Object -First 1
          if (-not $versionLine) {
            throw "Gradle did not report a project version."
          }
          $version = $versionLine -replace '^version:\s+', ''
          $expectedTag = "v$version"
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:GITHUB_REF_NAME -ne "main") {
            throw "Manual releases must be built from main."
          }
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' does not match project version '$version' (expected '$expectedTag')."
          }
          $publish = if ($env:PL4_ALLOW_PUBLICATION -eq "true") { "true" } else { "false" }
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF_TYPE -eq "branch") {
            $existing = git ls-remote --tags origin "refs/tags/$expectedTag"
            if ($LASTEXITCODE -ne 0) { throw "Could not check whether this version was already released." }
            if ($existing) {
              $publish = "false"
              Write-Host "Version $version is already tagged; no new release for this main update."
            }
          }
          "publish=$publish" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$expectedTag" >> $env:GITHUB_OUTPUT

      - name: Offline regression checks
        if: steps.version.outputs.publish == 'true'
        env:
          PYTHONUTF8: '1'
        run: python tools/run_offline_checks.py

      - name: Build and run native GameTests
        if: steps.version.outputs.publish == 'true'
        run: .\gradlew.bat --no-daemon --console=plain clean build runGameTestServer

      - name: Prepare checksums
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $jar = "build/libs/FoundationsPL4-1.6.4-$env:VERSION-srg.jar"
          $sources = "build/libs/FoundationsPL4-1.6.4-$env:VERSION-sources.jar"
          foreach ($file in @($jar, $sources)) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Expected release artifact was not produced: $file"
            }
          }
          $archive = "FoundationsPL4-$env:VERSION-source.zip"
          git archive --format=zip --output=$archive HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not archive the tagged source." }
          $artifacts = @($jar, $sources, $archive)
          $hashes = foreach ($file in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $hashes | Set-Content -Encoding ascii SHA256SUMS.txt

      - name: Publish validated GitHub Release
        if: env.PL4_ALLOW_PUBLICATION == 'true' && (steps.version.outputs.publish == 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          # Recheck the exact remapped Forge runtime immediately before any tag/release mutation.
          # The unsuffixed jar is the development-space artifact, not the verified 1.6.4 runtime.
          $runtimeJar = "build/libs/FoundationsPL4-1.6.4-$env:VERSION-srg.jar"
          if (-not (Test-Path $runtimeJar -PathType Leaf)) { throw "Missing verified 1.6.4 SRG runtime JAR." }
          $runtimeName = [System.IO.Path]::GetFileName($runtimeJar)
          $runtimeHash = (Get-FileHash -Algorithm SHA256 $runtimeJar).Hash.ToLowerInvariant()
          $checksumLines = @(Get-Content -Path SHA256SUMS.txt)
          $exact = @($checksumLines | Where-Object { $_ -ceq "$runtimeHash  $runtimeName" })
          $byName = @($checksumLines | Where-Object { $_ -match ("  " + [regex]::Escape($runtimeName) + "$") })
          if ($exact.Count -ne 1 -or $byName.Count -ne 1) {
            throw "Runtime checksum is missing, conflicting or not uniquely bound to the SRG JAR."
          }
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not check the release tag." }
          if ($remoteTag) {
            git fetch origin "refs/tags/${tag}:refs/tags/${tag}"
            if ($LASTEXITCODE -ne 0) { throw "Could not fetch the release tag." }
            $tagCommit = git rev-parse "${tag}^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:GITHUB_SHA) {
              throw "The existing release tag points to different source; use a new version."
            }
          } else {
            gh api "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "Could not create the validated release tag." }
          }
          $notes = "docs/releases/$env:VERSION.md"
          $title = "Foundations PL4 $env:VERSION"
          $prerelease = if ($env:VERSION -match "(alpha|beta|rc|\d[ab](\.|$))") { "true" } else { "false" }
          $artifacts = @($runtimeJar, "build/libs/FoundationsPL4-1.6.4-$env:VERSION-sources.jar", "FoundationsPL4-$env:VERSION-source.zip", "SHA256SUMS.txt")
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            # An existing release may already have CurseForge receipts; never overwrite assets.
            throw "Release already exists: reconcile its exact artifacts and upload receipts before any retry."
          } else {
            if (Test-Path $notes) {
              gh release create $tag @artifacts --verify-tag --title $title --notes-file $notes "--prerelease=$prerelease" --repo $env:GITHUB_REPOSITORY
            } else {
              gh release create $tag @artifacts --verify-tag --title $title --generate-notes "--prerelease=$prerelease" --repo $env:GITHUB_REPOSITORY
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not publish the validated release." }
          }

      - name: Upload tested runtime JAR to CurseForge when configured
        if: env.PL4_ALLOW_PUBLICATION == 'true' && (steps.version.outputs.publish == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python tools/upload_curseforge.py
