name: Audit retired 1.14.4 branch publishers
on:
  push:
    branches: ['mc/1.14.4']
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - '.github/workflows/forge-native.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify no obsolete source rewriting or publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflows=Path('.github/workflows')
          source={name:(workflows/name).read_text(encoding='utf-8') for name in ('forge-native.yml','release.yml','curseforge.yml')}
          prohibited=('git'+' push','gh'+' release'+' create','gh'+' release'+' upload','upload_'+'curseforge.py','contents:'+' write','tools/'+'prepare_1144.py')
          for name,body in source.items():
              for item in prohibited:
                  assert item not in body, (name,item)
          native=source['forge-native.yml']
          for required in ('bash gradlew --no-daemon','runtime.py native','production_smoke_1144.py','actions/upload-artifact@v4','checked-source.zip'):
              assert required in native, required
          assert "branches: [mc/1.14.4]" in native
          print('PASS: 1.14.4 exact-source native validation retained; stale publishers and auto-source mutations retired')
          PY
