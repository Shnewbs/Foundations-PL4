name: Audit retired 1.18 wrong-target release publisher
on:
  push:
    branches: ['mc/1.18']
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/curseforge.yml'
      - '.github/workflows/forge1180-native.yml'
      - 'tools/test_publisher_policy_1180.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce immutable exact-source validation and no branch publishing
        run: python3 -m unittest -v tools/test_publisher_policy_1180.py
