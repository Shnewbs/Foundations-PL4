name: Exercise legacy 1.12.2 Wireless Storage in a real client
on:
  push:
    branches: [main]
    paths: ['.github/workflows/legacy-client-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: mc/1.12.2
          path: candidate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle
          cache-dependency-path: candidate/**/*.gradle*
      - name: Install software display
        run: sudo apt-get update && sudo apt-get install -y xserver-xorg-core xserver-xorg-video-dummy x11-xserver-utils libgl1-mesa-dri
      - name: Inject isolated development probe
        run: |
          mkdir -p results candidate/run
          # The old generated development JAR can retain injected MergeTool enum classes.
          # Recreate this exact cached profile after applying the compatibility pin.
          rm -rf "$HOME/.gradle/caches/forge_gradle/minecraft_user_repo/net/minecraftforge/forge/1.12.2-14.23.5.2864_mapped_snapshot_20171003-1.12"
          git -C candidate rev-parse HEAD > results/SOURCE_COMMIT.txt
          cp control/tools/legacy-client-probe/LegacyWirelessClientProbe.java candidate/src/legacy/java/net/foundations/pl4/legacy/
          cat >> candidate/build.gradle <<'GRADLE'
          configurations.runtimeClasspath {
              ['asm','asm-analysis','asm-tree','asm-util','asm-commons'].each { name -> exclude group: 'org.ow2.asm', module: name }
          }
          configurations.all { resolutionStrategy.force 'net.minecraftforge:mergetool:0.2.3.3' }
          dependencies { runtimeOnly 'org.ow2.asm:asm-debug-all:5.2' }
          minecraft.runs.client {
              jvmArgs '-verbose:class'
              args '--width', '1280', '--height', '960', '--username', 'PL4LegacyProbe'
          }
          GRADLE
      - name: Run client, integrated world and native window actions
        working-directory: candidate
        env:
          PL4_CLIENT_OUTPUT: ${{ github.workspace }}/results
        run: |
          export PL4_CLIENT_SOURCE=$(cat ../results/SOURCE_COMMIT.txt)
          cat > ../results/xorg.conf <<'XORG'
          Section "Device"
            Identifier "Dummy"
            Driver "dummy"
            VideoRam 256000
          EndSection
          Section "Monitor"
            Identifier "Monitor"
            HorizSync 5.0-1000.0
            VertRefresh 5.0-200.0
            Modeline "1280x960" 108.00 1280 1376 1488 1800 960 961 964 1000 +HSync +VSync
          EndSection
          Section "Screen"
            Identifier "Screen"
            Device "Dummy"
            Monitor "Monitor"
            DefaultDepth 24
            SubSection "Display"
              Depth 24
              Modes "1280x960"
            EndSubSection
          EndSection
          XORG
          export DISPLAY=:99
          Xorg :99 -config "$GITHUB_WORKSPACE/results/xorg.conf" -noreset -nolisten tcp -logfile "$GITHUB_WORKSPACE/results/Xorg.log" > ../results/xorg-output.log 2>&1 &
          display_pid=$!
          trap 'kill "$display_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if xrandr --current > ../results/display-modes.txt 2>&1; then break; fi
            sleep 1
          done
          timeout 1500 bash gradlew --no-daemon --console=plain runClient > ../results/client.log 2>&1
      - name: Require actual native actions and four captures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('results');r=json.loads((root/'legacy-wireless-client.json').read_text())
          assert r['result']=='PASS' and r['signed_byte_revision']==70
          for key in ['native_wireless_withdrawal','stale_replay_rejected','native_wireless_deposit','native_paging']:assert r[key]
          assert len(r['captures'])==4
          for name in r['captures']:assert (root/name).stat().st_size>1000
          assert r['source_commit']==(root/'SOURCE_COMMIT.txt').read_text().strip()
          print('PASS real 1.12.2 client/native window actions and four GUI scales')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-wireless-real-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            candidate/run/logs/
            candidate/run/crash-reports/
          retention-days: 14
          if-no-files-found: error
