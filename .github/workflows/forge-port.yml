name: Verify exact Forge 1.20.1 development source without publishing
on:
  push:
    paths-ignore: ['.github/workflows/**', 'tools/test_publisher_policy_1201.py']
    branches: [mc/1.20.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-port-1.20.1
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preserve exact checked-out 1.20.1 source and hash
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          test "$(python3 -c 'import json; print(json.load(open("BUILD_STATUS.json"))["minecraft"])')" = '1.20.1'
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          sha256sum verification-logs/checked-source.zip > verification-logs/SOURCE_ARCHIVE_SHA256SUMS.txt
      - name: Build and run all native fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          bash gradlew --no-daemon --console=plain clean build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 191 required tests passed' verification-logs/native.log
      - name: Preserve native production JAR and runtime log hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          if test -d build/libs; then
            find build/libs -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 -r sha256sum > verification-logs/JAR_SHA256SUMS.txt
          fi
          if test -f verification-logs/native.log; then
            sha256sum verification-logs/native.log > verification-logs/LOG_SHA256SUMS.txt
          fi
      - name: Preserve exact source and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-port-1.20.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-commit.txt
            verification-logs/
            build/libs/
            build/reports/
            build/test-results/
            run/logs/
          retention-days: 14
          if-no-files-found: warn
