name: Verify Forge port
on:
  push:
    branches: [mc/1.20.1]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge-port-1.20.1
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply reviewed native test corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ports/repair_forge120.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src build.gradle
          if ! git diff --cached --quiet; then
            git commit -m 'Correct Forge tag aliases and strict codecs; isolate CI test config'
            git push origin HEAD:mc/1.20.1
          fi
          git rev-parse HEAD > source-commit.txt
      - name: Build and run all native fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          bash gradlew --no-daemon --console=plain build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 191 required tests passed' verification-logs/native.log
          git archive --format=zip --output=FoundationsPL4-1.20.1-0.2a-port.1-source.zip HEAD
          sha256sum build/libs/*.jar FoundationsPL4-1.20.1-0.2a-port.1-source.zip > verification-logs/SHA256SUMS.txt
      - name: Preserve exact source and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-port-1.20.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-commit.txt
            verification-logs/
            build/libs/
            build/reports/
            build/test-results/
            run/logs/
            *-source.zip
          retention-days: 14
          if-no-files-found: warn
