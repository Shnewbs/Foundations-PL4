name: Retired publish-port-26.yml 26.3 publisher - audit only
# No frozen build releases or branch-local CurseForge credentials.
on:
  push:
    branches: ['mc/26.3']
    paths: ['.github/workflows/publish-port-26.yml']
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit retired historical publisher
        run: python3 tools/release_263_policy.py audit
