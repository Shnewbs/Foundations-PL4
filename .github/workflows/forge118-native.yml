name: Forge 1.18.2 exact-source native validation
on:
  push:
    branches: [mc/1.18.2]
    paths-ignore:
      - '.github/workflows/**'
      - 'tools/test_publisher_policy_1182.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge118-native-validation
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture exact immutable source without changing the checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" | tee source-commit.txt verification-logs/SOURCE_COMMIT.txt
          sha256sum verification-logs/checked-source.zip > verification-logs/SOURCE_ARCHIVE_SHA256SUMS.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and execute 193 exact-source native GameTests
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 193 required tests passed' verification-logs/native.log
      - name: Record actual produced artifacts and diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification-logs
          if test -d build/libs; then
            find build/libs -maxdepth 1 -type f -name '*.jar' -print0 | sort -z | xargs -0 -r sha256sum > verification-logs/JAR_SHA256SUMS.txt
          fi
          for file in verification-logs/native.log source-commit.txt; do
            if test -f "$file"; then sha256sum "$file"; fi
          done > verification-logs/LOG_SHA256SUMS.txt
      - name: Preserve read-only exact-target native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge118-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-commit.txt
            verification-logs/
            run/logs/
            build/reports/
            build/libs/
          retention-days: 14
          if-no-files-found: warn
