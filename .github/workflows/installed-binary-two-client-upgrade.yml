name: Installed 1.21.1 production-JAR two-client saved-world upgrade
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/installed-binary-two-client-upgrade.yml'
      - 'tools/multiplayer-probe/installed_binary_two_clients.py'
      - 'tools/multiplayer-probe/test_installed_binary_two_clients.py'
      - 'tools/multiplayer-probe/MultiplayerServerProbe.java'
      - 'tools/multiplayer-probe/MultiplayerClientProbe.java'
      - 'tools/multiplayer-probe/test_installed_binary_world_upgrade.py'
      - 'tools/multiplayer-probe/installed_binary_smoke.py'
      - 'tools/multiplayer-probe/exact_native_candidate.py'
      - 'tools/multiplayer-probe/release_binary_preflight.py'
      - 'tools/multiplayer-probe/verify_upgrade_evidence.py'
      - 'tools/multiplayer-probe/verify_native_multipart_nbt.py'
      - 'tools/multiplayer-probe/test_verify_native_multipart_nbt.py'
      - 'tools/multiplayer-probe/verify_installed_client_nbt.py'
      - 'tools/multiplayer-probe/test_verify_installed_client_nbt.py'
      - 'tools/multiplayer-probe/verify_installed_cable_client_nbt.py'
      - 'tools/multiplayer-probe/test_verify_installed_cable_client_nbt.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pl4-exact-installed-1211-two-client-upgrade
  cancel-in-progress: true
jobs:
  real_installed_client_world_upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: control/**/*.gradle*
      - name: Install isolated graphical display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - name: Fail-closed installed-binary and saved-world regressions
        run: |
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_installed_binary_two_clients.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_verify_native_multipart_nbt.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_verify_installed_client_nbt.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_verify_installed_cable_client_nbt.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_installed_binary_smoke.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_release_binary_preflight.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_exact_native_candidate.py'
      - name: Obtain and verify exact immutable GitHub published 1.21.1 beta JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/immutable-baseline
          gh api repos/Shnewbs/Foundations-PL4/git/ref/tags/v0.2b.0 > results/immutable-baseline/tag-ref.json
          gh api repos/Shnewbs/Foundations-PL4/releases/tags/v0.2b.0 > results/immutable-baseline/release.json
          gh release download v0.2b.0 -R Shnewbs/Foundations-PL4 --pattern 'FoundationsPL4-1.21.1-0.2b.0.jar' --dir results/immutable-baseline
          python3 control/tools/multiplayer-probe/release_binary_preflight.py \
            --release-json results/immutable-baseline/release.json \
            --tag-ref-json results/immutable-baseline/tag-ref.json \
            --jar results/immutable-baseline/FoundationsPL4-1.21.1-0.2b.0.jar \
            --receipt results/immutable-baseline/verified-binary-preflight.json
      - name: Obtain exact independently native-qualified and retained candidate JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/pinned-native
          gh api repos/Shnewbs/Foundations-PL4/actions/artifacts/12885364230 > results/pinned-native/artifact-metadata.json
          curl --fail --show-error --silent --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Shnewbs/Foundations-PL4/actions/artifacts/12885364230/zip" \
            --output results/pinned-native/native-artifact.zip
          python3 control/tools/multiplayer-probe/exact_native_candidate.py \
            --artifact-zip results/pinned-native/native-artifact.zip \
            --artifact-metadata results/pinned-native/artifact-metadata.json \
            --artifact-sha256 0cc4200444044b094a25375cac419206bbbec542665dad942a3c726c355cea8a \
            --source-sha 1ea6d95a8503c8f4b430f77c3ca1ed5ee30d65d5 \
            --jar-sha256 fe19eda765f324e74f0d6d60abde5b532b0afd6fdfc67b95f368ccc9ff7f796d \
            --expected-native-tests 195 \
            --output results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar
      - name: Execute immutable installed beta JAR with two actual GUI clients
        run: |
          xvfb-run -a -s '-screen 0 1280x960x24' \
            python3 control/tools/multiplayer-probe/installed_binary_two_clients.py seed \
              --checkout control \
              --jar results/immutable-baseline/FoundationsPL4-1.21.1-0.2b.0.jar \
              --output binary-clients/seed --timeout-seconds 1500
      - name: Reopen exact saved world in installed candidate JAR with two GUI clients
        run: |
          xvfb-run -a -s '-screen 0 1280x960x24' \
            python3 control/tools/multiplayer-probe/installed_binary_two_clients.py restore \
              --checkout control \
              --jar results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar \
              --seed binary-clients/seed \
              --output binary-clients/restore --timeout-seconds 1500
      - name: Independently verify native client screenshots, permissions, inventories and saved world
        run: |
          python3 control/tools/multiplayer-probe/installed_binary_two_clients.py verify \
            --seed binary-clients/seed --restore binary-clients/restore
          python3 control/tools/multiplayer-probe/verify_installed_client_nbt.py \
            --seed binary-clients/seed --restore binary-clients/restore
          python3 control/tools/multiplayer-probe/verify_installed_cable_client_nbt.py \
            --seed binary-clients/seed --restore binary-clients/restore
      - name: Retain original and candidate native-world receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-native-two-client-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/immutable-baseline/tag-ref.json
            results/immutable-baseline/release.json
            results/immutable-baseline/verified-binary-preflight.json
            results/pinned-native/artifact-metadata.json
            results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar.provenance.json
            binary-clients/seed/*.json
            binary-clients/seed/*.log
            binary-clients/seed/*.png
            binary-clients/seed/*/installed-client-project.json
            binary-clients/seed/*.zip
            binary-clients/seed/*/run/logs/
            binary-clients/seed/*/run/crash-reports/
            binary-clients/restore/*.json
            binary-clients/restore/*.log
            binary-clients/restore/*.png
            binary-clients/restore/*/installed-client-project.json
            binary-clients/restore/*.zip
            binary-clients/restore/*/run/logs/
            binary-clients/restore/*/run/crash-reports/
          retention-days: 14
          if-no-files-found: warn
