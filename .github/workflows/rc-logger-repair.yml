name: Validate native logging on earlier Forge ports
# Wireless handoffs stage node escrow before player/provider mutations; exact-port fixtures verify uncertainty.
# Automatic triggers disabled; external builders and publishers only.
on:
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: rc-native-logger-correction
  cancel-in-progress: true
jobs:
  modern:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - minecraft: '1.14.4'
            branch: 'mc/1.14.4'
            java: '17'
          - minecraft: '1.15.2'
            branch: 'mc/1.15.2'
            java: '17'
          - minecraft: '1.16.5'
            branch: 'mc/1.16.5'
            java: '17'
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: port
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: matrix.java == '17'
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: port/**/*.gradle*
      - name: Prepare common unpublished RC development baseline
        run: python3 control/tools/ports/prepare_rc_candidate.py port '${{ matrix.minecraft }}'
      - name: Exact-target native validation
        run: python3 control/tools/ports/validate_rc_candidate.py port
      - name: Save only passing source on its existing version branch
        working-directory: port
        env:
          TARGET_BRANCH: ${{ matrix.branch }}
        shell: bash
        run: |
          set -euo pipefail
          parent=$(git rev-parse HEAD)
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)" = "$parent"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/net/foundations/pl4/core/TransferRules.java tools/R16RegressionTests.java src/main/java/net/foundations/pl4/NetworkEngine.java src/main/java/net/foundations/pl4/TransferEngine.java src/main/java/net/foundations/pl4/client/WirelessStorageScreen.java src/main/resources/assets/foundations_pl4/guide/en_us.json docs/FIELD_GUIDE.md build.gradle BUILD_STATUS.json release-version.txt docs/releases/0.2.0-rc.1-dev.md .github/workflows/
          if ! git diff --cached --quiet; then
            git commit -m 'Align validated RC development performance baseline; acceptance still pending'
            git push origin "HEAD:$TARGET_BRANCH"
          fi
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          (cd verification-logs && sha256sum checked-source.zip > source-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UNRELEASED-RC-development-${{ matrix.minecraft }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            port/verification-logs/
            port/build/libs/*.jar
            port/build/reports/
            port/build/test-results/
            port/run/logs/
            port/run/crash-reports/
          retention-days: 14
          if-no-files-found: warn
