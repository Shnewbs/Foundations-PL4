name: Native 1.16 parity with Java 8
on:
  push:
    branches: [main]
    paths: ['tools/parity-java8/**', '.github/workflows/parity-java8.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pl4-native-java8-parity
  cancel-in-progress: false
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.16.4', '1.16.5']
    env:
      TARGET: ${{ matrix.minecraft }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: coordinator
      - uses: actions/checkout@v4
        with:
          path: target
          ref: mc/${{ matrix.minecraft }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - name: Commit exact-target compatibility pipeline
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 ../coordinator/tools/parity-java8/prepare.py . "$TARGET"
          git diff --check
          git add tools/java8 tools/run_port_checks.py build.gradle BUILD_STATUS.json README.md .gitignore docs/FIELD_GUIDE.md docs/releases/ src/main/resources/assets/foundations_pl4/guide/en_us.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Build $TARGET feature port for Java 8 without a runtime agent"
            git push origin "HEAD:mc/$TARGET"
          fi
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
      - name: Build production and isolated scenario JARs
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build 2>&1 | tee verification-logs/build.log
      - name: Test actual installed Forge with Java 8
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/java8/runtime.py native 2>&1 | tee verification-logs/native-run.log
      - name: Publish only passed exact-target artifacts
        working-directory: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/mc/$TARGET" | cut -f1)" = "$(git rev-parse HEAD)"
          VERSION=$(python3 -c 'import json; print(json.load(open("BUILD_STATUS.json"))["version"])')
          TAG="mc$TARGET-v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-parse "$TAG^{commit}")" = "$(git rev-parse HEAD)"
            gh release view "$TAG"
            exit 0
          fi
          NAME="FoundationsPL4-$TARGET-$VERSION"
          mkdir -p release-files
          cp "build/libs/$NAME-java8.jar" "release-files/$NAME.jar"
          cp "build/libs/$NAME-sources.jar" release-files/
          git archive --format=zip --output="release-files/$NAME-source.zip" HEAD
          cp .java8-toolchain/jvmdowngrader-source.zip release-files/JvmDowngrader-2.0.1-source.zip
          cp verification-logs/installed-native.log verification-logs/java8-summary.json verification-logs/port-scenarios.json build/java8/archive-check.json build/java8/toolchain.json release-files/
          git rev-parse HEAD > release-files/SOURCE_COMMIT.txt
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" release-files/* --verify-tag --prerelease --title "Foundations PL4 $TARGET $VERSION - Java 8" --notes-file "docs/releases/$VERSION.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-java8-${{ matrix.minecraft }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/release-files/
            target/verification-logs/
            target/build/java8/*.json
            target/run-java8/crash-reports/
          retention-days: 14
          if-no-files-found: warn
