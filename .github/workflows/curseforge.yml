name: Retired 1.19.2 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.19.2']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no source-development or wrong-target CurseForge upload
        run: |
          python3 -m unittest -v tools/test_publisher_policy_1192.py
          echo 'Only main receipt-backed exact-target reconciler may publish a cleared beta.'
