name: Retired 26.3 CurseForge publisher - policy audit only

# This historical branch-local manual job used an adjacent-target 1.21.1
# filename and did not independently qualify the exact tagged 26.3 source.
# It is intentionally NOT a publication path. Existing releases are untouched.
# Qualified 26.3 release uploads are reconciled from main by
# .github/workflows/curseforge.yml via tools/curseforge_sync.py,
# after exact-target tagged-source clearance and checksums are recorded.
on:
  push:
    branches: [mc/26.3]
    paths: [.github/workflows/curseforge.yml]

permissions:
  contents: read

jobs:
  verify-retired-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm safe exact-target policy and absence of upload actions
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path('BUILD_STATUS.json').read_text(encoding='utf-8'))
          assert status.get('minecraft') == '26.3', 'Wrong source target'
          workflow = Path('.github/workflows/curseforge.yml').read_text(encoding='utf-8')
          # Restrict scanning to executable workflow declarations; test fixture
          # strings below cannot accidentally match their own guards.
          declarations = workflow.split('      - name: Confirm safe exact-target policy', 1)[0]
          assert 'workflow_' + 'dispatch:' not in declarations
          assert 'secrets.' not in declarations
          assert 'upload-' + 'file' not in declarations
          assert 'contents: write' not in declarations
          assert 'contents: read' in declarations, 'Publication write permission must remain disabled'
          assert 'branches: [mc/26.3]' in declarations
          assert 'uses: actions/checkout@v4' not in declarations
          print('PASS: historical 26.3 branch publisher cannot upload or relabel artifacts.')
          print('Qualified 26.3 uploads use main curseforge.yml, not this retired job.')
          PY
