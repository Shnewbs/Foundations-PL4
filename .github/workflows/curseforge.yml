name: Publish existing verified 1.12.2 Forge release to CurseForge
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable qualified GitHub release tag
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Verify tagged source and published release before downloading
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[A-Za-z0-9._-]+", tag):
              raise SystemExit("Invalid release tag")
          version = tag[1:]
          repo = os.environ["GITHUB_REPOSITORY"]
          source = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tagged = subprocess.check_output(["git", "rev-list", "-n", "1", tag], text=True).strip()
          if source != tagged:
              raise SystemExit("Checkout does not match requested tag commit")
          status = json.loads(Path("BUILD_STATUS.json").read_text(encoding="utf-8"))
          if status.get("minecraft") != "1.12.2" or status.get("loader") != "Forge" or status.get("version") != version:
              raise SystemExit("Exact-source Forge target/version mismatch")
          channel = str(status.get("release_channel", "")).lower()
          if channel not in ("alpha", "beta", "release") or re.search(r"(?:^|[._-])(?:dev|snapshot|nightly)(?:[._-]|$)", version, re.I):
              raise SystemExit("Development/unclassified source is not publishable")
          if re.search(r"(?:^|[._-])rc\d*(?:[._-]|$)", version, re.I) and (channel != "beta" or status.get("rc_publication_cleared") is not True):
              raise SystemExit("Exact tagged RC source has no publication clearance")
          release = json.loads(subprocess.check_output(["gh", "release", "view", tag, "--repo", repo, "--json", "tagName,isDraft,isPrerelease,body"], text=True))
          if release.get("tagName") != tag or release.get("isDraft") or (channel in ("alpha", "beta") and release.get("isPrerelease") is not True):
              raise SystemExit("Published GitHub release is missing, draft or has wrong maturity")
          jar = f"FoundationsPL4-1.12.2-{version}.jar"
          Path("build/libs").mkdir(parents=True, exist_ok=True)
          subprocess.run(["gh", "release", "download", tag, "--repo", repo, "--pattern", jar, "--pattern", "SHA256SUMS.txt", "--dir", "build/libs"], check=True)
          actual = hashlib.sha256((Path("build/libs") / jar).read_bytes()).hexdigest()
          lines = (Path("build/libs") / "SHA256SUMS.txt").read_text(encoding="utf-8").splitlines()
          matches = [line for line in lines if line == f"{actual}  {jar}"]
          if len(matches) != 1 or len([line for line in lines if line.rstrip().endswith("  " + jar)]) != 1:
              raise SystemExit("GitHub exact-target JAR checksum or uniqueness mismatch")
          notes = Path(f"docs/releases/{version}.md")
          notes.parent.mkdir(parents=True, exist_ok=True)
          notes.write_text(release["body"], encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"VERSION={version}\nRELEASE_TAG={tag}\n")
          PY
      - name: Upload exact validated Forge release to CurseForge
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python tools/upload_curseforge.py
