name: Retired 1.19.1 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.19.1']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no direct upload of wrong target
        run: python3 -m unittest -v tools/test_publisher_policy_1191.py
