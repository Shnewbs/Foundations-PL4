name: Retired 1.20.2 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.20.2']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify no branch-local upload or unsafe release
        run: python3 -m unittest -v tools/test_publisher_policy_1202.py
