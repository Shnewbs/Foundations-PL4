name: Retired 1.16.2 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.16.2']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm central exact-source receipt reconciliation is sole publishing path
        run: |
          python3 -m unittest -v tools/test_publisher_policy_1162.py
          echo 'No direct branch CurseForge upload or alpha/dev GitHub release.'
