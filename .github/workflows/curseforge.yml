name: Retired 1.15.2 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.15.2']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Audit receipt-backed centralized publication policy
        run: |
          python3 -m unittest -v tools/test_publisher_policy_1152.py
          echo 'No branch-local upload. Only explicitly accepted immutable exact-target releases may be reconciled centrally.'
