name: Mirror verified Minecraft releases to CurseForge

# Releases published with GitHub Actions' GITHUB_TOKEN do not trigger
# downstream workflows. An hourly reconciliation covers those releases.
on:
  release:
    types: [published]
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/curseforge.yml'
      - 'tools/upload_curseforge.py'
      - 'tools/curseforge_sync.py'
      - 'tools/test_curseforge_publish.py'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (blank = newest per Minecraft version)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate target identities, release maturity and checksum rules
        run: python3 tools/test_curseforge_publish.py
      - name: Upload exact validated versions and record receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          SELECTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'release' && -n "$RELEASE_EVENT_TAG" ]]; then
            python3 tools/curseforge_sync.py --tag "$RELEASE_EVENT_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && -n "$SELECTED_TAG" ]]; then
            python3 tools/curseforge_sync.py --tag "$SELECTED_TAG"
          else
            # Last published GitHub release per Minecraft target; no
            # relabeling or unverified adjacent-version artifacts.
            python3 tools/curseforge_sync.py --backfill
          fi
      - name: Archive upload IDs and per-version blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-sync-${{ github.run_id }}-${{ github.run_attempt }}
          path: curseforge-sync-report.json
          retention-days: 30
          if-no-files-found: warn
