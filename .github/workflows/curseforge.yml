name: Retired 1.17.1 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.17.1']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify main receipt-backed CurseForge reconciliation is the only upload path
        run: |
          python3 -m unittest -v tools/test_publisher_policy_1171.py
          echo 'No development, alpha or uncleared RC publication from this branch.'
