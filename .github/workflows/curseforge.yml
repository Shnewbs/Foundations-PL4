name: Retired 1.19.3 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.19.3']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Keep qualified release reconciliation centralized
        run: |
          python3 -m unittest -v tools/test_publisher_policy_1193.py
          echo 'No branch-local development or uncleared RC upload permitted.'
