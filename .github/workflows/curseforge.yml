name: Retired 1.20.1 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.20.1']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm central receipt-backed reconciler owns all cleared beta uploads
        run: |
          python3 -m unittest -v tools/test_publisher_policy_1201.py
          echo 'Direct version-branch CurseForge mutation remains disabled.'
