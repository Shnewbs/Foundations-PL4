name: Audit retired 26.1 curseforge.yml publisher (no release)
on:
  push:
    branches: ['mc/26.1']
    paths: ['.github/workflows/curseforge.yml']
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify historical publisher is read only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/curseforge.yml')
          source = path.read_text(encoding='utf-8')
          declarations = source.split('jobs:', 1)[0]
          assert "branches: ['mc/26.1']" in declarations
          assert 'contents: read' in declarations
          assert 'contents:' + ' write' not in declarations
          assert 'workflow_' + 'dispatch:' not in declarations
          assert 'workflow_' + 'run:' not in declarations
          assert 'release:' not in declarations
          assert 'secrets' + '.' not in source
          assert 'gh' + ' release' not in source
          assert '--' + 'clobber' not in source
          assert 'upload_' + 'curseforge.py' not in source
          assert 'api.' + 'curseforge.com' not in source
          assert 'FoundationsPL4-' + '1.21.1-' not in source
          assert 'actions/' + 'upload-artifact@v4' not in source
          print('PASS: mc/26.1 curseforge.yml cannot publish development, foreign-target, or uncleared RC artifacts.')
          print('Native source validation stays in main hourly-builds.yml with pinned exact refs.')
          PY
