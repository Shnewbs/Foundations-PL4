name: Retired 1.18.2 direct CurseForge uploader audit
on:
  push:
    branches: ['mc/1.18.2']
    paths: ['.github/workflows/curseforge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm only centralized exact-release receipt reconciliation remains
        run: |
          python3 -m unittest -v tools/test_publisher_policy_1182.py
          echo 'No branch-local CurseForge upload, release mutation, or development binary publication.'
