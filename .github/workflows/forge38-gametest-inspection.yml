name: Inspect native Minecraft 1.18 GameTest APIs
on:
  push:
    branches: [mc/1.18]
    paths:
      - 'tools/inspect_1180_gametest.py'
      - '.github/workflows/forge38-gametest-inspection.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve exact Forge38 mapped classes
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain classes
      - name: Inspect GameTest runner and native command methods
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/inspect_1180_gametest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge38-gametest-inspection-${{ github.run_id }}
          path: verification-logs/forge38-native-gametest-signatures.txt
          retention-days: 21
          if-no-files-found: warn
