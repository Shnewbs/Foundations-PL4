name: Validate native Minecraft 26.3 (no publication)
on:
  push:
    paths-ignore: ['.github/workflows/**', 'tools/release_263_policy.py', 'tools/test_release_263_policy.py']
    branches: ['mc/26.3']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  port:
    if: github.ref == 'refs/heads/mc/26.3'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        neoforge: ['26.3.0.23-beta', '26.3.0.39-beta']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read publication maturity from exact checked-out source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          """Shared release maturity and explicit RC clearance policy."""
          import re


          def release_type(version):
              text = version.lower()
              if re.search(r"(?:^|[.\-_])(?:dev|snapshot|nightly)(?:[.\-_]|$)", text):
                  raise ValueError("Development snapshots are not qualified releases")
              if re.search(r"beta|(?:^|[.\-_])rc\d*(?:[.\-_]|$)|\db(?:[.\-_]|$)", text):
                  return "beta"
              if re.search(r"alpha|preview|experimental|(?:^|[.\-_])port(?:[.\-_]|$)|\da(?:[.\-_]|$)", text):
                  return "alpha"
              return "release"


          def is_rc(version):
              return bool(re.search(r"(?:^|[.\-_])rc\d*(?:[.\-_]|$)", version, re.I))


          def require_publication(status, minecraft=None, version=None):
              if not isinstance(status, dict):
                  raise ValueError("Missing exact-source build status")
              actual = status.get("version", "")
              if not actual or (version is not None and actual != version):
                  raise ValueError("Build status and release version disagree")
              if minecraft is not None and status.get("minecraft") != minecraft:
                  raise ValueError("Build status and exact Minecraft target disagree")
              maturity = release_type(actual)
              if status.get("release_channel", "").lower() == "development":
                  raise ValueError("Development channel is not publishable")
              if is_rc(actual) and status.get("rc_publication_cleared") is not True:
                  raise ValueError("RC publication has not been explicitly cleared")
              return maturity

          status = json.loads(Path('BUILD_STATUS.json').read_text())
          try:
              require_publication(status)
              allowed = True
          except ValueError as error:
              allowed = False
              print('Publication held:', error)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PL4_ALLOW_PUBLICATION=' + str(allowed).lower() + '\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compile port
        run: |
          set -euo pipefail
          bash gradlew -PneoForgeVersion=${{ matrix.neoforge }} --no-daemon --console=plain compileJava 2>&1 | tee port-compile.log
      - name: Offline regression checks
        run: python3 tools/run_offline_checks.py
      - name: Build and native tests
        run: |
          set -euo pipefail
          bash gradlew -PneoForgeVersion=${{ matrix.neoforge }} --no-daemon --console=plain build
          bash gradlew -PneoForgeVersion=${{ matrix.neoforge }} --no-daemon --console=plain runGameTestServer 2>&1 | tee port-native.log
          python3 tools/verify_native_port_run.py port-native.log
      - name: Collect API migration diagnostics
        if: always()
        run: |
          mkdir -p port-diagnostics
          python3 tools/port_api_inventory.py
          cp port-compile.log port-diagnostics/ || true
          find "$HOME/.gradle/caches" -type f \( -name '*sources*.jar' -o -name '*manifest*.json' \) -printf '%p\n' > port-diagnostics/source-paths.txt
          find . -path './.git' -prune -o -name '*sources*.jar' -print >> port-diagnostics/source-paths.txt
          find "$HOME/.gradle/caches/neoformruntime" -maxdepth 4 -type f -printf '%p\n' >> port-diagnostics/source-paths.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-26-diagnostics-${{ matrix.neoforge }}
          path: |
            port-diagnostics/
            build/libs/
            build/reports/
            port-native.log
            run/logs/
            run/crash-reports/
