name: Audit retired 26.1.2 wrong-version 26.3 native controller
on:
  push:
    branches: ['mc/26.1.2']
    paths: ['.github/workflows/port-26.yml']
permissions:
  contents: read
jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned exact target isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from json import loads
          source = Path('.github/workflows/port-26.yml').read_text()
          declaration = source.split('jobs:', 1)[0]
          status = loads(Path('BUILD_STATUS.json').read_text())
          assert status['minecraft'] == '26.1.2'
          assert status['rc_publication_cleared'] is False
          assert "branches: ['mc/26.1.2']" in declaration
          assert 'contents: read' in declaration
          assert 'contents:' + ' write' not in declaration
          assert 'workflow_' + 'dispatch:' not in declaration
          assert 'branches:' + " ['mc/26.3']" not in declaration
          assert 'run' + 'GameTestServer' not in source
          assert 'gh' + ' release' not in source
          assert 'secrets' + '.' not in source
          print('PASS: obsolete branch-local 26.3 native workflow cannot misattribute 26.1.2 outputs.')
          print('The main hourly-builds.yml performs native pinned 26.1.2 source/JAR qualification.')
          PY
