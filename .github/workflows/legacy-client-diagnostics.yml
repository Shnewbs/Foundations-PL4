name: Inspect refined stock-client visuals and reports
on:
  push:
    branches: [main]
    paths: ['.github/workflows/legacy-client-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect native screenshots and qualified artifact reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/12509586214/zip" > /tmp/legacy-probe.zip
          python3 - <<'PY'
          import base64,hashlib,json,struct,zipfile
          from pathlib import Path
          p=Path('/tmp/legacy-probe.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='07f9dee3de07fda4fc31b0f5c28b34e8ce9ff3178c42e7f878f0e15e7df0e19e'
          print('ARTIFACT_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          with zipfile.ZipFile(p) as z:
              for name in ['results/legacy-wireless-client.json','results/stock-client-runtime.json']:
                  print('REPORT_START',name);print(z.read(name).decode());print('REPORT_END')
              images=[]
              for name in z.namelist():
                  if name.endswith('.png'):
                      data=z.read(name);width,height=struct.unpack('>II',data[16:24])
                      images.append(dict(name=name,sha256=hashlib.sha256(data).hexdigest(),width=width,height=height))
              print('REPORT_START images');print(json.dumps(images));print('REPORT_END')
              for name in ['results/legacy-wireless-storage-scale-1.png','results/legacy-wireless-storage-scale-4.png','results/legacy-wireless-storage-tooltip.png']:
                  print('IMAGE_START',name);print(base64.b64encode(z.read(name)).decode());print('IMAGE_END')
          PY
