name: Inspect refined legacy native evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/legacy-client-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read exact native packaged and migration reports
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          for artifact in json.loads('[{"id":12509086277,"sha":"11da07e6c8890f0240d36be0bf18d705dd9f6fed0863aeb4873416606ee83516"},{"id":12509056481,"sha":"ba7feeb795dfafceafc31fa9043fda2efea6472398db5138a939e227c36b71f3"}]'):
              path=Path('/tmp/native-'+str(artifact['id'])+'.zip')
              with path.open('wb') as output:subprocess.run(['gh','api','repos/'+os.environ['GH_REPO']+'/actions/artifacts/'+str(artifact['id'])+'/zip'],stdout=output,check=True)
              assert hashlib.sha256(path.read_bytes()).hexdigest()==artifact['sha']
              with zipfile.ZipFile(path) as z:
                  reports={name:json.loads(z.read('verification-logs/'+name+'.json')) for name in ['clean-native-summary','production-smoke','legacy-migration-summary','energy-summary']}
                  print('NATIVE_REPORT_START',artifact['id'])
                  print(json.dumps(dict(artifact_id=artifact['id'],artifact_sha256=artifact['sha'],reports=reports)))
                  print('NATIVE_REPORT_END')
          PY
