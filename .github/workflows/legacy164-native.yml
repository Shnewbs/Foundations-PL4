name: Forge 1.6.4 experimental native validation
on:
  push:
    branches: [mc/1.6.4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pl4-legacy164-native
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Isolated legacy runtime
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '7'
      - name: Modern build and legacy compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21
      - name: Native build, portable rules, server scenarios and cleanup guard
        shell: bash
        run: bash tools/validate_legacy_fluids.sh
      - name: Publish a new tested version without rewriting existing releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import re,pathlib; print(re.search(r\"^version\s*=\s*'([A-Za-z0-9._-]+)'\",pathlib.Path('build.gradle').read_text(),re.M).group(1))")
          tag="mc1.6.4-v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            git diff --exit-code "$tag" HEAD -- src/legacy build.gradle settings.gradle gradle.properties gradle/
            gh release view "$tag"
            echo 'Existing runtime source is unchanged; retain original tag and artifacts.'
            exit 0
          fi
          test "$(git ls-remote origin refs/heads/mc/1.6.4 | cut -f1)" = "$(git rev-parse HEAD)"
          test -f "docs/releases/$version.md"
          mkdir -p release-files
          cp "build/libs/FoundationsPL4-1.6.4-$version-srg.jar" "release-files/FoundationsPL4-1.6.4-$version.jar"
          cp "build/libs/FoundationsPL4-1.6.4-$version-sources.jar" release-files/
          git archive --format=zip --output="release-files/FoundationsPL4-1.6.4-$version-source.zip" HEAD
          cp run-legacy/legacy-scenarios.json verification-logs/native.log verification-logs/clean-native-summary.json release-files/
          git rev-parse HEAD > release-files/SOURCE_COMMIT.txt
          (cd release-files && sha256sum *.jar *.zip *.json *.log SOURCE_COMMIT.txt > SHA256SUMS.txt)
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" release-files/* --verify-tag --prerelease --title "Foundations PL4 1.6.4 $version (experimental)" --notes-file "docs/releases/$version.md"
      - name: Archive exact verified branch source
        if: success()
        shell: bash
        run: git archive --format=zip --output=verification-logs/verified-branch-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy164-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-files/
            verification-logs/
            run-legacy/legacy-scenarios.json
            build/libs/
          retention-days: 14
          if-no-files-found: warn
