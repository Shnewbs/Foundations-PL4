name: Forge Minecraft 1.20 full-feature port
on:
  push:
    paths-ignore: ['.github/workflows/**']
    branches: [mc/1.20]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forge120-native
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read publication maturity from exact checked-out source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          """Shared release maturity and explicit RC clearance policy."""
          import re
          
          
          def release_type(version):
              text = version.lower()
              if re.search(r"(?:^|[.\-_])(?:dev|snapshot|nightly)(?:[.\-_]|$)", text):
                  raise ValueError("Development snapshots are not qualified releases")
              if re.search(r"beta|(?:^|[.\-_])rc\d*(?:[.\-_]|$)|\db(?:[.\-_]|$)", text):
                  return "beta"
              if re.search(r"alpha|preview|experimental|(?:^|[.\-_])port(?:[.\-_]|$)|\da(?:[.\-_]|$)", text):
                  return "alpha"
              return "release"
          
          
          def is_rc(version):
              return bool(re.search(r"(?:^|[.\-_])rc\d*(?:[.\-_]|$)", version, re.I))
          
          
          def require_publication(status, minecraft=None, version=None):
              if not isinstance(status, dict):
                  raise ValueError("Missing exact-source build status")
              actual = status.get("version", "")
              if not actual or (version is not None and actual != version):
                  raise ValueError("Build status and release version disagree")
              if minecraft is not None and status.get("minecraft") != minecraft:
                  raise ValueError("Build status and exact Minecraft target disagree")
              maturity = release_type(actual)
              if status.get("release_channel", "").lower() == "development":
                  raise ValueError("Development channel is not publishable")
              if is_rc(actual) and status.get("rc_publication_cleared") is not True:
                  raise ValueError("RC publication has not been explicitly cleared")
              return maturity
          
          status = json.loads(Path('BUILD_STATUS.json').read_text())
          try:
              require_publication(status)
              allowed = True
          except ValueError as error:
              allowed = False
              print('Publication held:', error)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PL4_ALLOW_PUBLICATION=' + str(allowed).lower() + '\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare exact Forge46 source revision
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_120.py
          git diff --check
          git add src/main build.gradle BUILD_STATUS.json PORT_TARGET.json README.md docs/FIELD_GUIDE.md docs/releases/0.2a-port.1.md tools/run_port_checks.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Prepare exact Minecraft 1.20 / Forge46 source'
            git push origin HEAD:mc/1.20
          fi
          git diff --exit-code
          mkdir -p verification-logs
          git archive --format=zip --output=verification-logs/source-at-build.zip HEAD
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
      - name: Compile, reobfuscate, run 191 native Forge46 GameTests
        shell: bash
        run: |
          set -euo pipefail
          bash gradlew --no-daemon --console=plain clean build runGameTestServer 2>&1 | tee verification-logs/native.log
          grep -F 'All 191 required tests passed' verification-logs/native.log
      - name: Publish only successful source-matched Forge46 alpha
        if: env.PL4_ALLOW_PUBLICATION == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          target=1.20;version=$(python3 -c 'import json;print(json.load(open("BUILD_STATUS.json"))["version"])')
          name="FoundationsPL4-$target-$version";tag="mc$target-v$version"
          test "$(git ls-remote origin "refs/heads/mc/$target" | cut -f1)" = "$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$tag:refs/tags/$tag"
            git diff --exit-code "$tag" HEAD -- src/main build.gradle
            if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          else
            git tag "$tag";git push origin "$tag"
          fi
          mkdir -p release-files
          cp "build/libs/$name.jar" "build/libs/$name-sources.jar" release-files/
          git archive --format=zip --output="release-files/$name-source.zip" "$tag"
          cp verification-logs/native.log "release-files/$name-native-tests.log"
          git rev-parse "$tag^{commit}" > release-files/SOURCE_COMMIT.txt
          (cd release-files && sha256sum * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          gh release create "$tag" release-files/* --verify-tag --prerelease --title "Foundations PL4 $target $version — Forge46 alpha" --notes-file "docs/releases/$version.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge120-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-files/
            verification-logs/
            run/logs/
            build/reports/
          retention-days: 14
          if-no-files-found: warn
