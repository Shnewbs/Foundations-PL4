name: Forge Minecraft 1.19.4 native port acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and reobfuscate exact Forge 45 artifacts
        run: bash gradlew --no-daemon --console=plain clean build
      - name: Run installed native GameTests and production-only smoke
        run: python3 tools/run_1194_native_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forge1194-verification
          path: |
            build/libs/
            verification-logs/
          retention-days: 14
          if-no-files-found: warn
