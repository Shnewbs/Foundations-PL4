name: Forge 1.12.2 legacy preview validation
on:
  push:
    paths-ignore: ['.github/workflows/**']
    branches: [mc/1.12.2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pl4-legacy112-native
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read publication maturity from exact checked-out source
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          """Shared release maturity and explicit RC clearance policy."""
          import re


          def release_type(version):
              text = version.lower()
              if re.search(r"(?:^|[.\-_])(?:dev|snapshot|nightly)(?:[.\-_]|$)", text):
                  raise ValueError("Development snapshots are not qualified releases")
              if re.search(r"beta|(?:^|[.\-_])rc\d*(?:[.\-_]|$)|\db(?:[.\-_]|$)", text):
                  return "beta"
              if re.search(r"alpha|preview|experimental|(?:^|[.\-_])port(?:[.\-_]|$)|\da(?:[.\-_]|$)", text):
                  return "alpha"
              return "release"


          def is_rc(version):
              return bool(re.search(r"(?:^|[.\-_])rc\d*(?:[.\-_]|$)", version, re.I))


          def require_publication(status, minecraft=None, version=None):
              if not isinstance(status, dict):
                  raise ValueError("Missing exact-source build status")
              actual = status.get("version", "")
              if not actual or (version is not None and actual != version):
                  raise ValueError("Build status and release version disagree")
              if minecraft is not None and status.get("minecraft") != minecraft:
                  raise ValueError("Build status and exact Minecraft target disagree")
              maturity = release_type(actual)
              if status.get("release_channel", "").lower() == "development":
                  raise ValueError("Development channel is not publishable")
              if is_rc(actual) and status.get("rc_publication_cleared") is not True:
                  raise ValueError("RC publication has not been explicitly cleared")
              return maturity

          status = json.loads(Path('BUILD_STATUS.json').read_text())
          try:
              if status.get('minecraft') != '1.12.2' or status.get('loader') != 'Forge':
                  raise ValueError('Wrong exact Minecraft/Forge publication source')
              if str(status.get('release_channel', '')).lower() != 'beta':
                  raise ValueError('Only cleared beta RC builds may publish from native validation')
              if not is_rc(status.get('version', '')) or status.get('rc_publication_cleared') is not True:
                  raise ValueError('Explicit exact-source RC publication clearance required')
              require_publication(status, minecraft='1.12.2')
              allowed = True
          except (ValueError, KeyError, TypeError) as error:
              allowed = False
              print('Publication held:', error)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PL4_ALLOW_PUBLICATION=' + str(allowed).lower() + '\n')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Native build, portable rules, server scenarios and cleanup guard
        shell: bash
        run: bash tools/validate_legacy_fluids.sh
      - name: Verify item receipt and journal across native processes
        run: python3 tools/verify_legacy_item_restart.py
      - name: Verify actual pre-journal fault world import and restart
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/verify_preupgrade_item_faults.py
      - name: Publish a new tested version without rewriting existing releases
        if: env.PL4_ALLOW_PUBLICATION == 'true' && github.ref == 'refs/heads/mc/1.12.2'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The exact checked-out source must explicitly clear a beta RC;
          # this guard is independent of the earlier environment output.
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          status = json.loads(Path('BUILD_STATUS.json').read_text())
          version = status.get('version', '')
          gradle = re.search(r"^version\s*=\s*['\"]([^'\"]+)['\"]", Path('build.gradle').read_text(), re.M)
          if (status.get('minecraft') != '1.12.2' or status.get('loader') != 'Forge'
                  or status.get('release_channel') != 'beta'
                  or status.get('rc_publication_cleared') is not True
                  or not re.search(r'(?:^|[.\-_])rc\d*(?:[.\-_]|$)', version, re.I)
                  or re.search(r'(?:^|[.\-_])(?:dev|snapshot|nightly)(?:[.\-_]|$)', version, re.I)
                  or gradle is None or gradle.group(1) != version):
              raise SystemExit('Exact-source RC beta/target/version clearance missing; no release')
          PY
          test "$GITHUB_REF" = "refs/heads/mc/1.12.2"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/mc/1.12.2 | cut -f1)" = "$GITHUB_SHA"
          version=$(python3 -c "import json;print(json.load(open('BUILD_STATUS.json'))['version'])")
          tag="mc1.12.2-v$version"
          test -f "docs/releases/$version.md"
          # Never reuse an existing tag, even if its source happens to match:
          # an interrupted prior upload must be reconciled from its receipts.
          if [[ -n "$(git ls-remote --tags origin "refs/tags/$tag")" ]]; then
            echo "Existing tag $tag: reconcile immutable assets and CurseForge receipts; refusing duplicate upload." >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            echo "Existing GitHub release $tag: refusing duplicate upload." >&2
            exit 1
          fi
          mkdir -p release-files
          cp "build/libs/FoundationsPL4-1.12.2-$version.jar" release-files/
          cp "build/libs/FoundationsPL4-1.12.2-$version-sources.jar" release-files/
          git archive --format=zip --output="release-files/FoundationsPL4-1.12.2-$version-source.zip" HEAD
          cp run-legacy/legacy-scenarios.json verification-logs/native.log verification-logs/clean-native-summary.json release-files/
          git rev-parse HEAD > release-files/SOURCE_COMMIT.txt
          (cd release-files && sha256sum *.jar *.zip *.json *.log SOURCE_COMMIT.txt > SHA256SUMS.txt)
          # Validate unique checksum binding and exact source before changing any remote ref.
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('release-files')
          status = json.loads(Path('BUILD_STATUS.json').read_text())
          runtime = root / ('FoundationsPL4-1.12.2-' + status['version'] + '.jar')
          if not runtime.is_file() or not (root / 'SHA256SUMS.txt').is_file():
              raise SystemExit('Missing exact-target runtime or checksums')
          lines = (root / 'SHA256SUMS.txt').read_text().splitlines()
          matching = [line for line in lines if line.endswith('  ' + runtime.name)]
          digest = hashlib.sha256(runtime.read_bytes()).hexdigest()
          if len(matching) != 1 or matching[0] != digest + '  ' + runtime.name:
              raise SystemExit('Missing, ambiguous or mismatched exact runtime checksum')
          if (root / 'SOURCE_COMMIT.txt').read_text().strip() != __import__('os').environ['GITHUB_SHA']:
              raise SystemExit('Source commit differs from exact tested checkout')
          PY
          # GitHub rejects an already-created tag atomically (422); never force/update tags.
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" >/dev/null
          test "$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)" = "$GITHUB_SHA"
          gh release create "$tag" release-files/* --verify-tag --prerelease --title "Foundations PL4 1.12.2 $version" --notes-file "docs/releases/$version.md" --repo "$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName,isPrerelease,assets > release-files/GITHUB_RELEASE_RECEIPT.json
      - name: Archive exact verified branch source
        if: success()
        shell: bash
        run: git archive --format=zip --output=verification-logs/verified-branch-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy112-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-files/
            verification-logs/
            run-legacy/legacy-scenarios.json
            build/libs/
          retention-days: 14
          if-no-files-found: warn
