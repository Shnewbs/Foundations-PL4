name: Installed 1.21.1 released-beta to candidate world-byte upgrade
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/installed-binary-world-upgrade.yml'
      - 'tools/multiplayer-probe/installed_binary_world_upgrade.py'
      - 'tools/multiplayer-probe/test_installed_binary_world_upgrade.py'
      - 'tools/multiplayer-probe/installed_binary_smoke.py'
      - 'tools/multiplayer-probe/exact_native_candidate.py'
      - 'tools/multiplayer-probe/release_binary_preflight.py'
      - 'tools/multiplayer-probe/verify_upgrade_evidence.py'
      - 'tools/multiplayer-probe/verify_native_multipart_nbt.py'
      - 'tools/multiplayer-probe/test_verify_native_multipart_nbt.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pl4-installed-beta-candidate-world-byte-upgrade
  cancel-in-progress: true
jobs:
  installed_world_upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: control/**/*.gradle*
      - name: Fail-closed installed-binary and saved-world regressions
        run: |
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_installed_binary_world_upgrade.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_verify_native_multipart_nbt.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_installed_binary_smoke.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_release_binary_preflight.py'
          python3 -m unittest discover -s control/tools/multiplayer-probe -p 'test_exact_native_candidate.py'
      - name: Obtain and verify exact immutable GitHub published 1.21.1 beta JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/immutable-baseline
          gh api repos/Shnewbs/Foundations-PL4/git/ref/tags/v0.2b.0 > results/immutable-baseline/tag-ref.json
          gh api repos/Shnewbs/Foundations-PL4/releases/tags/v0.2b.0 > results/immutable-baseline/release.json
          gh release download v0.2b.0 -R Shnewbs/Foundations-PL4 --pattern 'FoundationsPL4-1.21.1-0.2b.0.jar' --dir results/immutable-baseline
          python3 control/tools/multiplayer-probe/release_binary_preflight.py \
            --release-json results/immutable-baseline/release.json \
            --tag-ref-json results/immutable-baseline/tag-ref.json \
            --jar results/immutable-baseline/FoundationsPL4-1.21.1-0.2b.0.jar \
            --receipt results/immutable-baseline/verified-binary-preflight.json
      - name: Obtain exact independently native-qualified and retained candidate JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/pinned-native
          gh api repos/Shnewbs/Foundations-PL4/actions/artifacts/12859271452 > results/pinned-native/artifact-metadata.json
          curl --fail --show-error --silent --location --retry 2 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Shnewbs/Foundations-PL4/actions/artifacts/12859271452/zip" \
            --output results/pinned-native/native-artifact.zip
          python3 control/tools/multiplayer-probe/exact_native_candidate.py \
            --artifact-zip results/pinned-native/native-artifact.zip \
            --artifact-metadata results/pinned-native/artifact-metadata.json \
            --artifact-sha256 357be6c367d5f3e7b0b8a0edde28e57c8be06d4f237d4d3a5f931208109026d7 \
            --source-sha aa9b439b69106b6232ef2c58fdfa155889d0ba1f \
            --jar-sha256 cee5787af35f95af092a65b4a049276619bf24547b342c60192674cb360f030c \
            --output results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar
      - name: Start actual published beta server, place PL4 host and save native world
        run: |
          python3 control/tools/multiplayer-probe/installed_binary_world_upgrade.py seed \
            --checkout control \
            --jar results/immutable-baseline/FoundationsPL4-1.21.1-0.2b.0.jar \
            --sha256 7fa14351e1bbf039846afba040e4b66ce16b98db64103f1b33fc8ce14df0c229 \
            --output binary-upgrade/seed --timeout-seconds 1500
      - name: Install candidate JAR and reopen byte-identical saved beta world
        run: |
          python3 control/tools/multiplayer-probe/installed_binary_world_upgrade.py restore \
            --checkout control \
            --jar results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar \
            --sha256 cee5787af35f95af092a65b4a049276619bf24547b342c60192674cb360f030c \
            --seed binary-upgrade/seed \
            --baseline-sha256 7fa14351e1bbf039846afba040e4b66ce16b98db64103f1b33fc8ce14df0c229 \
            --output binary-upgrade/restore --timeout-seconds 1500
      - name: Independently verify exact installed binary/world identities and artifacts
        run: |
          python3 control/tools/multiplayer-probe/installed_binary_world_upgrade.py verify \
            --seed binary-upgrade/seed --restore binary-upgrade/restore \
            --baseline-sha256 7fa14351e1bbf039846afba040e4b66ce16b98db64103f1b33fc8ce14df0c229 \
            --candidate-sha256 cee5787af35f95af092a65b4a049276619bf24547b342c60192674cb360f030c
      - name: Independently inspect real saved PL4 multipart NBT from both installed JAR servers
        run: |
          python3 control/tools/multiplayer-probe/verify_native_multipart_nbt.py \
            --seed binary-upgrade/seed --restore binary-upgrade/restore \
            --baseline-sha256 7fa14351e1bbf039846afba040e4b66ce16b98db64103f1b33fc8ce14df0c229 \
            --candidate-sha256 cee5787af35f95af092a65b4a049276619bf24547b342c60192674cb360f030c
      - name: Retain original and candidate native-world receipts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-native-world-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/immutable-baseline/tag-ref.json
            results/immutable-baseline/release.json
            results/immutable-baseline/verified-binary-preflight.json
            results/pinned-native/artifact-metadata.json
            results/pinned-native/FoundationsPL4-1.21.1-0.2.0-rc.1-dev.jar.provenance.json
            binary-upgrade/seed/*.json
            binary-upgrade/seed/*.log
            binary-upgrade/seed/*.zip
            binary-upgrade/seed/run/logs/
            binary-upgrade/seed/run/crash-reports/
            binary-upgrade/restore/*.json
            binary-upgrade/restore/*.log
            binary-upgrade/restore/*.zip
            binary-upgrade/restore/run/logs/
            binary-upgrade/restore/run/crash-reports/
          retention-days: 14
          if-no-files-found: warn
