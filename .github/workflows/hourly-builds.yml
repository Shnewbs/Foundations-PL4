name: Hourly exact-version native builds
on:
  schedule:
    - cron: '37 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/hourly-builds.yml', 'tools/hourly_builds.py', 'tools/ports/validate_rc_candidate.py', 'tools/ports/native_26_coverage.py', 'tools/test_native_26_coverage.py', 'tools/test_hourly_builds.py', 'tools/test_legacy_*.py', 'tools/test_preupgrade_item_fault_gate.py', 'tools/test_historical_provider_outcomes.py']
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even unchanged source with a retained successful artifact
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: pl4-hourly-native-builds
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      count: ${{ steps.targets.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Check scheduler and publication regressions
        run: python3 -m unittest discover -s tools -p 'test_hourly_builds.py'
      - name: Check actual legacy native count regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_native_counts.py'
      - name: Check exact live evidence regression names and outcomes
        run: python3 -m unittest discover -s tools -p 'test_legacy_live_evidence.py'
      - name: Check live decode phase coverage regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_live_decode.py'
      - name: Check native decode placement observations
        run: python3 -m unittest discover -s tools -p 'test_legacy_decode_placements.py'
      - name: Check handheld provider discovery ordering regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_endpoint_discovery.py'
      - name: Check handheld readiness admission regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_handheld_admission.py'
      - name: Check retained evidence readmission regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_live_admission.py'
      - name: Check live mutation process coverage regressions
        run: python3 -m unittest discover -s tools -p "test_legacy_live_mutation.py"
      - name: Check legacy restart evidence regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_restart_gate.py'
      - name: Check raw and missing decode process evidence regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_decode_restart_gate.py'
      - name: Check saved decode-world NBT regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_decode_world.py'
      - name: Check bounded read-only evidence collector regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_evidence_collector.py'
      - name: Check bounded opaque export transcript regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_journal_export.py'
      - name: Check persisted provider outcome regressions
        run: python3 -m unittest discover -s tools -p 'test_legacy_provider_outcomes.py'
      - name: Check historical provider outcome regressions
        run: python3 -m unittest discover -s tools -p 'test_historical_provider_outcomes.py'
      - name: Check pre-upgrade fault evidence regressions
        run: python3 -m unittest discover -s tools -p 'test_preupgrade_item_fault_gate.py'
      - name: Check 26.x native count attribution regressions
        run: python3 -m unittest discover -s tools -p 'test_native_26_coverage.py'
      - id: targets
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE_REBUILD" = 'true' ]; then args+=(--force); fi
          python3 tools/hourly_builds.py discover "${args[@]}"
  native:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: port
      - uses: actions/setup-java@v4
        if: matrix.minecraft == '1.6.4'
        with:
          distribution: zulu
          java-version: '7'
      - uses: actions/setup-java@v4
        if: matrix.java == '17' || matrix.minecraft == '1.6.4'
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: port/**/*.gradle*
      - name: Archive immutable input before running gates
        working-directory: port
        run: |
          mkdir -p verification-logs
          git rev-parse HEAD > verification-logs/SOURCE_COMMIT.txt
          git archive --format=zip --output=verification-logs/checked-source.zip HEAD
          sha256sum verification-logs/checked-source.zip > verification-logs/source-SHA256SUMS.txt
      - name: Run modern exact-target build and native scenarios
        if: matrix.kind == 'modern'
        run: python3 control/tools/ports/validate_rc_candidate.py port
      - name: Run legacy native scenarios, production-only boot and generated-world upgrade
        if: matrix.kind == 'legacy'
        working-directory: port
        env:
          TARGET: ${{ matrix.minecraft }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f tools/test_restart_phase_retention.py ]; then python3 -m unittest discover -s tools -p test_restart_phase_retention.py; fi
          bash tools/validate_legacy_fluids.sh
          if [ "$TARGET" = '1.12.2' ]; then
            python3 tools/production_smoke_1122.py
          else
            python3 tools/production_smoke_164.py
          fi
          python3 tools/verify_legacy_upgrade.py
          if [ -f tools/verify_legacy_item_restart.py ]; then python3 tools/verify_legacy_item_restart.py; fi
          if [ -f tools/verify_preupgrade_item_faults.py ]; then python3 tools/verify_preupgrade_item_faults.py; fi
      - name: Require coherent exact-source and packaged-artifact evidence
        run: python3 control/tools/hourly_builds.py record port '${{ matrix.minecraft }}' '${{ matrix.sha }}'
      - uses: actions/upload-artifact@v4
        id: passed_artifact
        with:
          name: hourly-native-${{ matrix.minecraft }}-${{ matrix.sha }}
          path: |
            port/verification-logs/
            port/build/libs/*.jar
            port/run-legacy/legacy-scenarios.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: failed_artifact
        if: failure()
        with:
          name: FAILED-hourly-native-${{ matrix.minecraft }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            port/verification-logs/
            port/build/reports/
            port/run/logs/
            port/run/crash-reports/
            port/run-legacy/legacy-scenarios.json
            port/run-legacy/crash-reports/
          retention-days: 14
          if-no-files-found: warn
      - name: Remove temporary checkout and build outputs after evidence upload
        if: always() && (steps.passed_artifact.outcome == 'success' || steps.failed_artifact.outcome == 'success')
        run: rm -rf port

