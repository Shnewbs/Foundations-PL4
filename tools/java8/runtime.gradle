// Compile modern source, then convert language features/API calls BEFORE Forge reobfuscation.
// The official 1.16.1 mapped Widget contains a duplicate getHeight declaration.
// Fix ONLY a temporary build-tool hierarchy, never the installed Forge/Minecraft classes.
def remapClasspath = { collection ->
    files(collection.files.collect { entry ->
        entry.name.endsWith('mapped_official_1.16.1.jar') ? file('build/java8/native-hierarchy.jar') : entry
    })
}
tasks.register('prepareRemapHierarchy', Exec) {
    dependsOn 'classes'
    doFirst {
        def out=file('build/java8/original-hierarchy-classpath.txt');out.parentFile.mkdirs()
        out.text=sourceSets.main.compileClasspath.files.collect { it.absolutePath }.join(File.pathSeparator)
    }
    commandLine 'python3','tools/java8/remap_hierarchy.py'
}
tasks.register('java8InputJar', Jar) {
    dependsOn 'classes'
    archiveClassifier = 'java8-input'
    from sourceSets.main.output
    from('LICENSE'); from('LICENSE-SonarCore'); from('NOTICE')
}
tasks.register('java8TestInputJar', Jar) {
    dependsOn 'portTestClasses'
    archiveClassifier = 'java8-tests-input'
    from sourceSets.portTest.output
}
tasks.register('java8Classpath') {
    dependsOn 'prepareRemapHierarchy'
    doLast {
        def out = file('build/java8/classpath.txt'); out.parentFile.mkdirs()
        out.text = remapClasspath(sourceSets.portTest.compileClasspath).files.collect { it.absolutePath }.join(File.pathSeparator)
    }
}
tasks.register('convertJava8', Exec) {
    dependsOn 'java8InputJar', 'java8TestInputJar', 'java8Classpath'
    commandLine 'python3','tools/java8/runtime.py','convert'
}
tasks.register('java8RuntimeJar', Jar) {
    dependsOn 'convertJava8'
    archiveClassifier = 'java8'
    from { zipTree(file('build/java8/runtime-shaded.jar')) }
    manifest { attributes('Implementation-Version':project.version,'PL4-Runtime-Java':'8') }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.register('java8ScenarioJar', Jar) {
    dependsOn 'convertJava8'
    archiveClassifier = 'java8-scenarios'
    from { zipTree(file('build/java8/tests-shaded.jar')) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
afterEvaluate {
    reobf {
        jar { classpath = remapClasspath(sourceSets.main.compileClasspath) }
        java8RuntimeJar { classpath = remapClasspath(sourceSets.main.compileClasspath) }
        java8ScenarioJar { classpath = remapClasspath(sourceSets.portTest.compileClasspath) }
    }
    tasks.matching { it.name in ['reobfJar','reobfJava8RuntimeJar','reobfJava8ScenarioJar'] }.configureEach {
        dependsOn 'prepareRemapHierarchy'
    }
}
tasks.named('java8RuntimeJar') { finalizedBy 'reobfJava8RuntimeJar' }
tasks.named('java8ScenarioJar') { finalizedBy 'reobfJava8ScenarioJar' }
tasks.register('verifyJava8Runtime', Exec) {
    dependsOn 'reobfJava8RuntimeJar','reobfJava8ScenarioJar'
    commandLine 'python3','tools/java8/runtime.py','verify'
}
tasks.named('build') { dependsOn 'verifyJava8Runtime' }
