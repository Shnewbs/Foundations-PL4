// Forge 35's original ModLauncher 8.0.9 predates the JDK manifest-verifier change.
// Pin a distinct, explicit compatibility profile; this does not change Minecraft or Forge.
configurations.configureEach {
    resolutionStrategy.eachDependency { dep ->
        if (dep.requested.group == 'cpw.mods' && dep.requested.name == 'modlauncher') dep.useVersion('8.1.3')
        if (dep.requested.group == 'org.ow2.asm') dep.useVersion('9.2')
    }
}
minecraft.runs.configureEach {
    jvmArgs '--add-exports=java.base/sun.security.util=ALL-UNNAMED', '--add-opens=java.base/java.util.jar=ALL-UNNAMED'
}
