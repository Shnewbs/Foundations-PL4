def r17VerifierClasses = layout.buildDirectory.dir('r17VerifierClasses')
tasks.register('compileR17RuleVerifier',JavaCompile){
    source=files('src/main/java/net/foundations/pl4/core/DisplayFacing.java',
        'src/main/java/net/foundations/pl4/core/HologramProjection.java','tools/R17RegressionTests.java')
    classpath=files();destinationDirectory=r17VerifierClasses;options.release=21;options.encoding='UTF-8'
}
tasks.register('verifyR17Rules',JavaExec){
    dependsOn tasks.named('compileR17RuleVerifier');classpath=files(r17VerifierClasses);mainClass='R17RegressionTests'
}
tasks.named('check'){dependsOn tasks.named('verifyR17Rules')}
